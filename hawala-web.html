<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر حواله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000000;--s1:#000000;--s2:#0a0a0a;--bd:#2f3336;--tx:#ffffff;--mu:#71767b;
  --ac:#6aa3ff;--acx:#00121f;--ok:#3ed598;--bad:#ff7a7a;--zero:#9aa7c0;
  --okbg:rgba(62,213,152,.14);--badbg:rgba(255,122,122,.14);--zerobg:rgba(154,167,192,.14);
  color-scheme:dark;
}
html[data-theme=green]{--bg:#0c1a14;--s1:#132a20;--s2:#1a3829;--bd:#2a4d3a;--tx:#e6f3ec;--mu:#8fb09f;--ac:#5fd39c;--acx:#06170f;--ok:#7be0ae;--bad:#ff8f7a;--zero:#9dbcae;--okbg:rgba(123,224,174,.15);--badbg:rgba(255,143,122,.15);--zerobg:rgba(157,188,174,.16);color-scheme:dark}
html[data-theme=gray]{--bg:#e9ebef;--s1:#ffffff;--s2:#f3f4f7;--bd:#d3d7df;--tx:#1c2230;--mu:#667085;--ac:#3f4a63;--acx:#ffffff;--ok:#0f8a57;--bad:#c02f2f;--zero:#5b6577;--okbg:rgba(15,138,87,.12);--badbg:rgba(192,47,47,.11);--zerobg:rgba(91,101,119,.12);color-scheme:light}
html[data-theme=ocean]{--bg:#06182a;--s1:#0c2a40;--s2:#123a56;--bd:#1f5073;--tx:#e2f1fa;--mu:#83a9c2;--ac:#3cc4f0;--acx:#031522;--ok:#4fe0b5;--bad:#ff8585;--zero:#8fb0c6;--okbg:rgba(79,224,181,.14);--badbg:rgba(255,133,133,.14);--zerobg:rgba(143,176,198,.16);color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.75;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);padding:10px 0;margin:0 -14px 8px;padding-inline:10px;border-bottom:1px solid var(--bd)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.acts{display:flex;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--tx)}
.ib:hover{background:var(--s1)}

/* cards and buttons */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.badge-flag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12px;font-weight:600}
.pin-ic{color:var(--ac)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash div{text-align:center}
.dash small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
.dash b{font-size:18px}
.gsec{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
.trend{margin-top:12px}
button.card{width:100%;text-align:start}
.rem{display:block}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);color:var(--acx);border-color:transparent}
.btn.dng{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btns{display:grid;gap:10px;margin-top:16px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row-btns .btn{padding:0 10px;font-size:14px;text-align:center}
.stack{display:grid;gap:10px}

/* pills */
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.8}
.pill.cred{color:var(--ok);background:var(--okbg)}
.pill.debt{color:var(--bad);background:var(--badbg)}
.pill.zero{color:var(--zero);background:var(--zerobg)}
.chip{display:inline-block;padding:0 9px;border-radius:8px;font-size:12px;background:var(--s2);color:var(--mu);border:1px solid var(--bd)}

/* home */
.co{display:flex;align-items:center;justify-content:space-between;gap:12px}
.co-name{font-weight:700;font-size:16px}
.co-sub{font-size:13px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap}
.co-end{text-align:end;display:grid;gap:2px;justify-items:end;flex-shrink:0}
.co-amt{font-weight:700;font-size:15px}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .btn{max-width:692px;margin:0 auto;display:flex}
.empty{text-align:center;padding:44px 18px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.note{border-inline-start:4px solid var(--ac);border-radius:8px;background:var(--s1);padding:10px 14px;margin-bottom:12px;font-size:14px}
.note.warn{border-color:var(--bad)}
.note .btn{min-height:38px;margin-top:8px;font-size:14px}
.search{margin-bottom:12px}

/* company page */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kind{display:grid;gap:2px}
.kind-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.kind.read .kind-h{color:var(--ok)}
.kind.paid .kind-h{color:var(--bad)}
.kind-n{color:var(--mu);font-size:13px}
.kind-t{font-size:18px;font-weight:700}
.ledger{margin-top:12px;padding:16px 18px}
.ledger .lr{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ledger .lr b{font-size:16px}
.ledger .rule{border-top:2px solid var(--tx);margin:8px 0 10px}
.ledger .net{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ledger .net b{font-size:24px;line-height:1.3}
.ledger .why{font-size:13px;color:var(--mu);margin-top:8px}

/* lists */
.sumbar{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:12px}
.sumbar small{display:block;color:var(--mu);font-size:13px}
.sumbar b{font-size:20px}
.rem{margin-top:10px}
.rem-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rno{font-weight:700;color:var(--mu)}
.ramt{font-weight:700;font-size:18px}
.rem-mid{font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* detail */
.det .big{font-size:28px;font-weight:700;line-height:1.3}
.det .words{color:var(--mu);font-size:14px;margin:2px 0 12px}
.dl{margin:0;display:grid;gap:0}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--bd)}
.dl dt{color:var(--mu);flex-shrink:0}
.dl dd{margin:0;text-align:end;overflow-wrap:anywhere}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);padding:9px 12px;font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.field input[dir=ltr]{text-align:right}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.msg{color:var(--bad);font-size:13px;margin-top:4px}
.three{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px}
.words-box{min-height:46px;border-radius:12px;border:1px dashed var(--bd);padding:9px 12px;color:var(--mu);font-size:14px;background:transparent}
.ro input{opacity:.8}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet h2{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 6px}
@keyframes up{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 6px;background:none;border:0;border-bottom:1px solid var(--bd);text-align:start;font-size:16px}
.mi:last-child{border-bottom:0}
.mi.dng{color:var(--bad)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.sw button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--bd);background:var(--s2)}
.sw button.on{border-color:var(--ac)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(128,128,128,.4);display:inline-block}
.taBox{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);padding:10px;font-size:14px;direction:ltr;text-align:left}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.sec{margin:18px 0 4px;font-size:15px;font-weight:700}

.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:88vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}

/* report */
.rep-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  html[data-theme]{--bg:#fff;--s1:#fff;--s2:#fff;--bd:#999;--tx:#111;--mu:#444;--ok:#0a7d4f;--bad:#b42323;--zero:#444;--okbg:#fff;--badbg:#fff;--zerobg:#fff}
  .no-print{display:none!important}
  :root{padding:0}
  .app{padding:0;max-width:none}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/*PURE*/
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function toLatin(s){
  return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return FA_D.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)});
}
function g2j(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334],jy;
  if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
var W1=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
var W10=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
var W100=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
var WS=['','هزار','میلیون','میلیارد','تریلیون'];
function w3(n){
  var p=[],h=Math.floor(n/100),r=n%100;
  if(h)p.push(W100[h]);
  if(r){
    if(r<20)p.push(W1[r]);
    else{var t=Math.floor(r/10),o=r%10;p.push(W10[t]+(o?' و '+W1[o]:''))}
  }
  return p.join(' و ');
}
function words(n){
  n=Math.floor(Number(n));
  if(!n||n<0)return '';
  var g=[],i=0;
  while(n>0&&i<WS.length){
    var x=n%1000;
    if(x)g.unshift(w3(x)+(WS[i]?' '+WS[i]:''));
    n=Math.floor(n/1000);i++;
  }
  return g.join(' و ');
}
function pad4(n){return String(n).padStart(4,'0')}
function j2g(jy,jm,jd){
  var gy;
  if(jy>979){gy=1600;jy-=979}else{gy=621}
  var days=(365*jy)+(Math.floor(jy/33)*8)+Math.floor(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  gy+=400*Math.floor(days/146097);days%=146097;
  if(days>36524){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  var gd=days+1,sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31],gm;
  for(gm=0;gm<13;gm++){var v=sal[gm];if(gd<=v)break;gd-=v}
  return [gy,gm,gd];
}
/*ENDPURE*/

var THEMES={night:'سیاه (X)',green:'سبز آرام',gray:'خاکستری',ocean:'آبی اقیانوسی'};
var THEME_SW={night:['#0e1524','#6aa3ff'],green:['#132a20','#5fd39c'],gray:['#e9ebef','#3f4a63'],ocean:['#0c2a40','#3cc4f0']};
var MONTHS=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
var GMONTHS=['جنوری','فبروری','مارچ','اپریل','می','جون','جولای','اگست','سپتمبر','اکتوبر','نومبر','دسمبر'];
var ST={cred:'طلبکار',debt:'بدهکار',zero:'تسویه'};
var KIND={read:'خوانده‌گی',paid:'پرداختی'};
var KEY='hawala_web_v1';

var storageOk=true;
var app=document.getElementById('app');
var ui={q:'',searchOpen:false,listQ:'',listSearchOpen:false};
var stack=[{v:'home'}];
var sheetEl=null,onOk=null,toastT=null;

/* ---------- basics ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function nowISO(){return new Date().toISOString()}
function D(s){s=String(s);return db.digits==='fa'?s.replace(/\d/g,function(d){return FA_D[d]}):s}
function money(n){return D(Number(n).toLocaleString('en-US'))}
function jToday(){var d=new Date();return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())}
function isoOf(g){return g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0')}
function todayISO(){var d=new Date();return isoOf([d.getFullYear(),d.getMonth()+1,d.getDate()])}
function fmtDate(iso){
  var g=String(iso).split('-').map(Number);
  if(db.dateFmt==='greg')return D(g[2])+' '+GMONTHS[g[1]-1]+' '+D(g[0]);
  var j=g2j(g[0],g[1],g[2]);
  return D(j[2])+' '+MONTHS[j[1]-1]+' '+D(j[0]);
}
function fmtStamp(iso){
  var d=new Date(iso);if(isNaN(d))return '';
  return fmtDate(isoOf([d.getFullYear(),d.getMonth()+1,d.getDate()]));
}
function norm(s){return toLatin(s).toLowerCase().trim()}

/* ---------- data ---------- */
function blank(){return {v:1,theme:'night',digits:'fa',dateFmt:'jalali',lastBackup:'',debtThreshold:500000,inactiveDays:30,companies:[]}}
function cleanList(a){
  return (Array.isArray(a)?a:[]).filter(function(r){return r&&typeof r==='object'}).map(function(r){
    var dt=/^\d{4}-\d{2}-\d{2}$/.test(r.date)?r.date:todayISO();
    var pa=dt.split('-').map(Number);
    if(pa[1]<1||pa[1]>12||pa[2]<1||pa[2]>31)dt=todayISO();
    else if(pa[0]<1700)dt=isoOf(j2g(pa[0],pa[1],pa[2]));
    return {
      id:String(r.id||uid()),createdAt:String(r.createdAt||nowISO()),date:dt,
      no:String(r.no==null?'':r.no).slice(0,20),idCard:String(r.idCard||'').slice(0,40),
      sender:String(r.sender||'').slice(0,100),receiver:String(r.receiver||'').slice(0,100),
      fatherName:String(r.fatherName||'').slice(0,100),
      amount:Math.max(0,Math.floor(Number(r.amount)||0)),
      place:String(r.place||'').slice(0,100),notes:String(r.notes||'').slice(0,500),
      shares:Math.max(0,Math.floor(Number(r.shares)||0)),edited:!!r.edited,editedAt:String(r.editedAt||'')
    };
  });
}
function cleanClosed(a){
  return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x==='object'}).map(function(x){
    var n=function(v){return Math.floor(Number(v)||0)};
    var diff=n(x.diff);
    return {
      id:String(x.id||uid()),jy:n(x.jy),jm:Math.min(12,Math.max(1,n(x.jm)||1)),label:String(x.label||''),
      closedAt:String(x.closedAt||nowISO()),
      readCount:n(x.readCount),readTotal:n(x.readTotal),paidCount:n(x.paidCount),paidTotal:n(x.paidTotal),
      diff:diff,status:statusOf(diff),
      moveReadTotal:n(x.moveReadTotal),movePaidTotal:n(x.movePaidTotal),
      readList:cleanList(x.readList),paidList:cleanList(x.paidList)
    };
  });
}
function sanitize(d){
  var out=blank();
  if(d&&THEMES[d.theme])out.theme=d.theme;
  if(d&&d.digits==='en')out.digits='en';
  if(d&&d.dateFmt==='greg')out.dateFmt='greg';
  if(d&&Number(d.debtThreshold)>0)out.debtThreshold=Math.floor(Number(d.debtThreshold));
  if(d&&Number(d.inactiveDays)>0)out.inactiveDays=Math.floor(Number(d.inactiveDays));
  if(d&&typeof d.lastBackup==='string')out.lastBackup=d.lastBackup;
  (Array.isArray(d&&d.companies)?d.companies:[]).forEach(function(c){
    if(!c||typeof c.name!=='string')return;
    out.companies.push({
      id:String(c.id||uid()),name:c.name.trim().slice(0,80)||'بدون نام',note:String(c.note||'').slice(0,300),
      pinned:!!c.pinned,createdAt:String(c.createdAt||nowISO()),read:cleanList(c.read),paid:cleanList(c.paid),closed:cleanClosed(c.closed)
    });
  });
  return out;
}
function load(){
  try{
    var t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);
  }catch(e){storageOk=false;return blank()}
  try{
    var s=localStorage.getItem(KEY);
    if(s)return sanitize(JSON.parse(s));
  }catch(e){}
  return blank();
}
var db=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOk=false}
  if(!applyingRemote)cloudPush();
}
function co(id){return db.companies.find(function(c){return c.id===id})}

/* ---------- cloud sync (optional, Firebase) ---------- */
var FB_KEY='hawala_fb_cfg';
var fb={app:null,auth:null,db:null,user:null,unsub:null};
var applyingRemote=false;
function loadFbConfig(){try{return JSON.parse(localStorage.getItem(FB_KEY)||'null')}catch(e){return null}}
function saveFbConfig(cfg){try{localStorage.setItem(FB_KEY,JSON.stringify(cfg))}catch(e){}}
function clearFbConfig(){try{localStorage.removeItem(FB_KEY)}catch(e){}}
function cloudEnabled(){return !!loadFbConfig()}
function cloudStatusText(){return fb.user?('وارد شده: '+fb.user.email):'در انتظار ورود'}
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function docRef(){return fb.db.collection('hawala_shared').doc('data')}
var cloudPushT=null;
function cloudPush(){
  if(!fb.db||!fb.user)return;
  clearTimeout(cloudPushT);
  cloudPushT=setTimeout(function(){
    docRef().set({payload:JSON.stringify(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:fb.user.email}).catch(function(){toast('همگام‌سازی ابری ناموفق بود؛ اینترنت را بررسی کنید')});
  },700);
}
function startCloudSync(){
  var gate=document.getElementById('loginGate');if(gate)gate.remove();
  if(fb.unsub)return;
  fb.unsub=docRef().onSnapshot(function(snap){
    if(!snap.exists){cloudPush();return}
    var data=snap.data();
    try{
      var remote=JSON.parse(data.payload);
      applyingRemote=true;
      db=sanitize(remote);
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      applyingRemote=false;
      render();
    }catch(e){}
  },function(){toast('خطا در دریافت داده‌های ابری')});
}
function stopCloudSync(){if(fb.unsub){fb.unsub();fb.unsub=null}}
function showLoginGate(){
  var g=document.getElementById('loginGate');
  if(!g){g=document.createElement('div');g.id='loginGate';g.className='sheet-wrap';g.style.zIndex='90';document.body.appendChild(g)}
  g.innerHTML='<div class="sheet" style="max-width:380px;margin:auto"><h2>ورود به حساب ابری</h2><p class="mu">با ایمیلی که در Firebase برای شما یا پدرتان ساخته شده وارد شوید.</p>'+
    '<div class="field"><label for="lg_email">ایمیل</label><input id="lg_email" type="email" dir="ltr" style="text-align:left" autocomplete="username"></div>'+
    '<div class="field"><label for="lg_pass">رمز عبور</label><input id="lg_pass" type="password" dir="ltr" style="text-align:left" autocomplete="current-password"></div>'+
    '<div class="msg" id="msg_login" hidden></div>'+
    '<div class="btns"><button class="btn pri" data-act="doLogin">ورود</button><button class="btn" data-act="cloudDisconnect">قطع اتصال ابری و کار آفلاین</button></div></div>';
}
function initCloud(){
  var cfg=loadFbConfig();if(!cfg)return;
  var v='8.10.1';
  loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-app.js')
    .then(function(){return loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-auth.js')})
    .then(function(){return loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore.js')})
    .then(function(){
      fb.app=firebase.initializeApp(cfg);
      fb.auth=firebase.auth();fb.db=firebase.firestore();
      fb.auth.onAuthStateChanged(function(u){
        fb.user=u;
        if(u){startCloudSync()}else{stopCloudSync();showLoginGate()}
      });
    })
    .catch(function(){toast('اتصال ابری برقرار نشد؛ اینترنت یا تنظیمات را بررسی کنید')});
}
function calc(list){return {count:list.length,total:list.reduce(function(a,r){return a+r.amount},0)}}
function statusOf(diff){return diff>0?'debt':diff<0?'cred':'zero'}
function summary(c){
  var r=calc(c.read),p=calc(c.paid),diff=r.total-p.total;
  return {r:r,p:p,diff:diff,st:statusOf(diff)};
}
function lastActivity(c){
  var t='';
  c.read.concat(c.paid).forEach(function(r){if(r.createdAt>t)t=r.createdAt});
  return t;
}
function isFlagged(c){
  var s=summary(c);
  if(!s.diff)return false;
  if(Math.abs(s.diff)>=db.debtThreshold)return true;
  var la=lastActivity(c);
  if(!la)return false;
  var days=Math.floor((Date.now()-new Date(la).getTime())/864e5);
  return days>=db.inactiveDays;
}
function dashboardTotals(){
  var cred=0,debt=0;
  db.companies.forEach(function(c){var s=summary(c);if(s.st==='cred')cred+=Math.abs(s.diff);else if(s.st==='debt')debt+=Math.abs(s.diff)});
  return {cred:cred,debt:debt};
}
function nextNo(c){
  var m=0;
  c.read.forEach(function(r){var n=parseInt(toLatin(r.no),10);if(!isNaN(n)&&n>m)m=n});
  return m+1;
}
function byNew(a,b){return a.createdAt<b.createdAt?1:a.createdAt>b.createdAt?-1:0}

/* ---------- ui helpers ---------- */
function toast(m){
  var t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>';
  clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},3200);
}
function openSheet(html){
  closeSheet();

  sheetEl.className='sheet-wrap no-print';
  sheetEl.setAttribute('data-act','sheetBg');
  sheetEl.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(sheetEl);
  var f=sheetEl.querySelector('[data-focus]');if(f)setTimeout(function(){f.focus()},50);
}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}}
function confirmSheet(o,fn){
  onOk=fn;
  openSheet('<h2>'+esc(o.title)+'</h2><p class="mu">'+o.msg+'</p><div class="btns"><button class="btn '+(o.danger?'dng':'pri')+'" data-act="confirmOk">'+esc(o.ok)+'</button><button class="btn" data-act="closeSheet">انصراف</button></div>');

function openMenu(items){
  openSheet(items.map(function(i){
    return '<button class="mi '+(i.d?'dng':'')+'" data-act="'+i.a+'">'+esc(i.t)+'</button>';
  }).join(''));
}
function go(v,p){stack.push(Object.assign({v:v},p||{}));render();window.scrollTo(0,0)}
function back(){if(stack.length>1)stack.pop();render();window.scrollTo(0,0)}
function header(title,o){
  o=o||{};
  return '<header class="top no-print">'+(o.back?'<button class="ib" data-act="back" aria-label="بازگشت">'+I.back+'</button>':'')+
    '<h1>'+esc(title)+'</h1><div class="acts">'+(o.actions||[]).join('')+'</div></header>';
}
function menuBtn(act){return '<button class="ib" data-act="'+act+'" aria-label="منو">'+I.more+'</button>'}
function pill(st){return '<span class="pill '+st+'">'+ST[st]+'</span>'}
function field(id,label,val,o){
  o=o||{};
  return '<div class="field'+(o.ro?' ro':'')+'" id="fld_'+id+'"><label for="'+id+'">'+esc(label)+'</label>'+
    (o.area?'<textarea id="'+id+'">'+esc(val)+'</textarea>':
    '<input id="'+id+'" type="text" value="'+esc(val)+'"'+(o.ltr?' dir="ltr"':'')+(o.num?' inputmode="numeric"':'')+(o.amt?' data-amt="1"':'')+(o.ro?' readonly':'')+' autocomplete="off">')+
    '<div class="msg" id="msg_'+id+'" hidden></div></div>';
}
function copyText(t){
  return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){return true},function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta);ta.select();var ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    ta.remove();return ok;
  });
}

var V={};

function dashCard(){
  if(db.companies.length<2)return '';
  var t=dashboardTotals();
  return '<div class="card dash"><div><small>جمع طلبکاری</small><b style="color:var(--ok)">'+money(t.cred)+'</b></div><div><small>جمع بدهکاری</small><b style="color:var(--bad)">'+money(t.debt)+'</b></div></div>';
}
function remGlobalResults(q){
  if(!q)return '';
  var hits=[];
  db.companies.forEach(function(c){
    ['read','paid'].forEach(function(k){
      c[k].forEach(function(r){
        var hay=norm(r.sender+' '+r.receiver+' '+r.no+' '+r.place+' '+r.notes+' '+r.fatherName);
        if(hay.indexOf(norm(q))>-1)hits.push({c:c,k:k,r:r});
      });
    });
  });
  if(!hits.length)return '';
  hits.sort(function(a,b){return -byNew(a.r,b.r)});
  hits=hits.slice(0,20);
  return '<div class="gsec">نتایج حواله‌ها ('+D(hits.length)+')</div><div class="stack">'+hits.map(function(h){
    return '<button class="card rem" data-act="openRemFrom" data-cid="'+h.c.id+'" data-kind="'+h.k+'" data-id="'+h.r.id+'"><div class="rem-top"><span class="rno">'+esc(h.c.name)+' — شماره '+D(h.r.no)+'</span><span class="ramt">'+money(h.r.amount)+'</span></div><div class="rem-mid">'+esc(h.r.receiver)+'</div><div class="rem-bot"><span>'+fmtDate(h.r.date)+'</span><span class="chip">'+KIND[h.k]+'</span></div></button>';
  }).join('')+'</div>';
}
function trendChart(c){
  var pts=c.closed.slice().sort(function(a,b){return a.closedAt<b.closedAt?-1:1});
  if(pts.length<2)return '<div class="card trend mu" style="font-size:13px">برای دیدن نمودار روند، حداقل ۲ ماه را ببندید.</div>';
  var w=320,h=90,pad=8,vals=pts.map(function(x){return x.diff});
  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));
  var rng=(mx-mn)||1;
  var step=(w-pad*2)/(pts.length-1);
  var zy=h-pad-((0-mn)/rng)*(h-pad*2);
  var path=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return (i?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  var dots=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="'+(x.diff>0?'var(--bad)':x.diff<0?'var(--ok)':'var(--zero)')+'"/>';
  }).join('');
  return '<div class="card trend"><div class="gsec" style="margin:0 0 8px">روند ماهانه (تفاوت حساب)</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible">'+
    '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="var(--bd)" stroke-width="1"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--ac)" stroke-width="2"/>'+dots+'</svg>'+
    '<div class="rem-bot"><span>'+esc(pts[0].label)+'</span><span>'+esc(pts[pts.length-1].label)+'</span></div></div>';
}
function companyCards(q){
  var cs=db.companies.slice().sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return a.name.localeCompare(b.name,'fa');
  });
  if(q)cs=cs.filter(function(c){return norm(c.name).indexOf(norm(q))>-1});
  if(!db.companies.length)return '<div class="empty"><b>هنوز حسابی ثبت نشده</b>با «افزودن حساب» اولین شرکت یا صراف را اضافه کنید.</div>';
  if(!cs.length)return q?'':'<div class="empty"><b>حسابی پیدا نشد</b>نام دیگری را جستجو کنید.</div>';
  return (cs.length?'<div class="gsec">حساب‌ها</div>':'')+'<div class="stack">'+cs.map(function(c){
    var s=summary(c),fl=isFlagged(c);
    return '<button class="card co" data-act="openCo" data-id="'+c.id+'"><div><div class="co-name">'+(c.pinned?'<span class="pin-ic">'+I.pin+'</span> ':'')+esc(c.name)+'</div><div class="co-sub"><span>'+D(s.r.count)+' حواله خوانده‌گی</span><span>'+D(s.p.count)+' حواله پرداختی</span></div>'+(fl?'<div class="badge-flag">'+I.flag+' نیاز به پیگیری</div>':'')+'</div>'+
      '<div class="co-end">'+pill(s.st)+(s.diff?'<div class="co-amt">'+money(Math.abs(s.diff))+'</div>':'')+'</div></button>';
  }).join('')+'</div>';
}
function backupNote(){
  if(!db.companies.length)return '';
  var days=db.lastBackup?Math.floor((Date.now()-new Date(db.lastBackup).getTime())/864e5):null;
  if(days!==null&&days<7)return '';
  var txt=days===null?'هنوز از اطلاعات پشتیبان نگرفته‌اید. داده‌ها فقط روی همین مرورگر ذخیره می‌شوند.':'آخرین پشتیبان '+D(days)+' روز پیش بود.';
  return '<div class="note no-print">'+txt+'<br><button class="btn" data-act="backupSheet">پشتیبان‌گیری</button></div>';
}

function dateSelects(iso){
  var g=iso.split('-').map(Number),greg=db.dateFmt==='greg';
  var t=greg?g:g2j(g[0],g[1],g[2]),names=greg?GMONTHS:MONTHS;
  var cy=greg?new Date().getFullYear():jToday()[0],d='',m='',y='',i;
  for(i=1;i<=31;i++)d+='<option value="'+i+'"'+(i===t[2]?' selected':'')+'>'+D(i)+'</option>';
  for(i=0;i<12;i++)m+='<option value="'+(i+1)+'"'+(i+1===t[1]?' selected':'')+'>'+names[i]+'</option>';
  var lo=Math.min(cy-5,t[0]),hi=Math.max(cy+1,t[0]);
  for(i=hi;i>=lo;i--)y+='<option value="'+i+'"'+(i===t[0]?' selected':'')+'>'+D(i)+'</option>';
  return '<div class="field" id="fld_date"><label>تاریخ ('+(greg?'میلادی':'شمسی')+')</label><div class="three"><select id="f_d" aria-label="روز">'+d+'</select><select id="f_m" aria-label="ماه">'+m+'</select><select id="f_y" aria-label="سال">'+y+'</select></div><div class="msg" id="msg_date" hidden></div></div>';

/* ---------- files ---------- */
var dlCache;
function getDL(){
  if(dlCache!==undefined)return Promise.resolve(dlCache);
  if(!(window.claude&&window.claude.use)){dlCache=false;return Promise.resolve(false)}
  return window.claude.use('downloads').then(function(x){dlCache=x||null;return dlCache},function(){dlCache=null;return null});
}
function saveFile(name,data,mime){
  return getDL().then(function(dl){
    if(dl){
      return dl.save({filename:name,data:data}).then(function(){return 'saved'},function(e){
        if(e&&(e.code==='declined'))return 'declined';
        if(e&&e.code==='rate_limited'){toast('کمی صبر کنید و دوباره تلاش کنید');return 'declined'}
        return 'fail';
      });
    }
    if(dl===false){
      try{
        var u=URL.createObjectURL(new Blob([data],{type:mime}));
        var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},2000);return 'saved';
      }catch(e){return 'fail'}
    }
    return 'fail';
  });
}
function textExport(title,text){
  openSheet('<h2>'+esc(title)+'</h2><p class="mu">دانلود فایل در این مرورگر ممکن نشد. متن را کپی کنید و در یک فایل یا پیام ذخیره کنید.</p><textarea class="taBox" id="expText" readonly>'+esc(text)+'</textarea><div class="btns"><button class="btn pri" data-act="copyExp">کپی متن</button><button class="btn" data-act="closeSheet">بستن</button></div>');
}
function stamp(){return todayISO()}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvFor(list){
  var head=['حساب','نوع','شماره حواله','تاریخ','فرستنده','گیرنده','ولد گیرنده','شماره تذکره','مبلغ (افغانی)','مبلغ به حروف','محل پرداخت','توضیحات','تعداد ارسال','ویرایش‌شده'];
  var rows=[head];
  list.forEach(function(c){
    ['read','paid'].forEach(function(k){
      c[k].slice().sort(function(a,b){return -byNew(a,b)}).forEach(function(r){
        rows.push([c.name,KIND[k],r.no,fmtDate(r.date).replace(/[۰-۹]/g,function(d){return FA_D.indexOf(d)}),r.sender,r.receiver,r.fatherName,r.idCard,r.amount,words(r.amount),r.place,r.notes,r.shares,r.edited?'بله':'']);
      });
    });
  });
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|\s]+/g,'-').slice(0,40)}
function exportCsv(list,name){
  var any=list.some(function(c){return c.read.length||c.paid.length});
  if(!any){toast('حواله‌ای برای خروجی وجود ندارد');return}
  var csv=csvFor(list);
  saveFile('hawala-'+name+'-'+stamp()+'.csv',csv,'text/csv').then(function(s){
    if(s==='saved')toast('فایل CSV ذخیره شد');else if(s==='fail')textExport('خروجی CSV',csv);
  });
}

  confirmSheet({title:'حذف حساب «'+c.name+'»',msg:'همهٔ حواله‌ها و تاریخچهٔ ماه‌های این حساب برای همیشه پاک می‌شود. اگر مطمئن نیستید، ابتدا پشتیبان بگیرید.',ok:'حذف حساب',danger:true},function(){
    db.companies=db.companies.filter(function(x){return x.id!==c.id});save();stack=[{v:'home'}];render();toast('حساب حذف شد');
  });
};

/* amount input */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-amt]')){
    var v=toLatin(t.value).replace(/\D/g,'').replace(/^0+/,'').slice(0,12);
    t.value=D(v.replace(/\B(?=(\d{3})+(?!\d))/g,','));
    var w=$('#amtWords');if(w)w.textContent=v?words(Number(v))+' افغانی':'—';
  }else if(t.id==='q'){
    ui.q=t.value;var l=$('#clist');if(l)l.innerHTML=companyCards(ui.q)+remGlobalResults(ui.q);
  }else if(t.id==='lq'){
    ui.listQ=t.value;var cur=stack[stack.length-1],full=co(cur.cid)[cur.kind];
    var filtered=ui.listQ?full.filter(function(r){return norm(r.sender+' '+r.receiver+' '+r.no+' '+r.place+' '+r.notes+' '+r.fatherName).indexOf(norm(ui.listQ))>-1}):full;
    var rl=$('#rlist');if(rl)rl.innerHTML=full.length?remRows(filtered):'<div class="empty"><b>حواله‌ای ثبت نشده</b>با «ثبت حواله» اولین مورد را اضافه کنید.</div>';
  }
});

/* remittances */
A.saveRem=function(){
  clearErrs();
  var cur=stack[stack.length-1],c=co(cur.cid),edit=!!cur.rid,list=c[cur.kind];
  var v={
    no:toLatin($('#f_no').value).trim(),idCard:toLatin($('#f_idc').value).trim(),
    sender:$('#f_sender').value.trim(),receiver:$('#f_receiver').value.trim(),fatherName:$('#f_father').value.trim(),
    amount:Number(toLatin($('#f_amt').value).replace(/\D/g,''))||0,place:$('#f_place').value.trim(),notes:$('#f_notes').value.trim(),
    date:''
  };
  var bad=false;
  (function(){
    var y=Number($('#f_y').value),m=Number($('#f_m').value),d=Number($('#f_d').value),g;
    if(db.dateFmt==='greg'){
      var t=new Date(y,m-1,d);
      if(t.getMonth()===m-1&&t.getDate()===d)v.date=isoOf([y,m,d]);
    }else{
      g=j2g(y,m,d);var b=g2j(g[0],g[1],g[2]);
      if(b[0]===y&&b[1]===m&&b[2]===d)v.date=isoOf(g);
    }
    if(!v.date){showErr('date','این تاریخ وجود ندارد؛ روز یا ماه را درست کنید');bad=true}
  })();
  if(cur.kind==='read'&&!edit)v.no=pad4(nextNo(c));
  if(!v.no){showErr('f_no','شمارهٔ حواله را وارد کنید');bad=true}
  else if(list.some(function(r){return r.id!==cur.rid&&toLatin(r.no).trim()===v.no})){showErr('f_no','این شماره قبلاً در همین لیست ثبت شده است');bad=true}
  if(!v.sender){showErr('f_sender','نام فرستنده را وارد کنید');bad=true}
  if(!v.receiver){showErr('f_receiver','نام گیرنده را وارد کنید');bad=true}
  if(!v.amount){showErr('f_amt','مبلغ را به عدد وارد کنید');bad=true}
  if(!v.place){showErr('f_place','محل پرداخت را وارد کنید');bad=true}
  if(bad){var e1=document.querySelector('.field.err');if(e1)e1.scrollIntoView({block:'center'});return}
  if(edit){
    var r=list.find(function(x){return x.id===cur.rid});
    Object.assign(r,v,{edited:true,editedAt:nowISO()});
  }else{
    list.unshift(Object.assign({id:uid(),createdAt:nowISO(),shares:0,edited:false,editedAt:''},v));
  }
  save();stack.pop();render();window.scrollTo(0,0);toast(edit?'تغییرات ذخیره شد':'حواله ثبت شد');
};
A.delRem=function(){
  var cur=stack[stack.length-1],c=co(cur.cid);
  var r=c[cur.kind].find(function(x){return x.id===cur.rid});
  confirmSheet({title:'حذف حواله '+D(r.no),msg:'این حواله حذف می‌شود و جمع‌ها دوباره محاسبه می‌شوند.',ok:'حذف حواله',danger:true},function(){
    c[cur.kind]=c[cur.kind].filter(function(x){return x.id!==r.id});save();stack.pop();render();toast('حواله حذف شد');
  });
};

/* sharing */
function shareText(c,r){
  var line='__________________________________';
  var L=['🏪 '+c.name,'','📝 مشخصات حواله',line,'📅 تاریخ: '+fmtDate(r.date),'💠 نمبر: '+D(r.no),'💠 فرستنده: '+r.sender,'💠 گیرنده: '+r.receiver];
  if(r.fatherName)L.push('💠 ولد گیرنده: '+r.fatherName);
  L.push('💠 مبلغ: '+money(r.amount)+' افغانی','💠 مبلغ به حروف: '+words(r.amount)+' افغانی','💠 محل پرداخت: '+r.place,line,'💠 توضیحات: '+(r.notes||'بدون توضیحات'));
  return L.join('\n');
}
function curRem(){
  var cur=stack[stack.length-1],c=co(cur.cid);
  return {c:c,r:c[cur.kind].find(function(x){return x.id===cur.rid})};
}
function bumpShare(r){r.shares=(r.shares||0)+1;save();render()}
A.share=function(){
  var x=curRem(),t=shareText(x.c,x.r);
  if(navigator.share){
    navigator.share({text:t}).then(function(){bumpShare(x.r)},function(e){if(!(e&&e.name==='AbortError'))shareSheet(t)});
  }else shareSheet(t);
};
function shareSheet(t){
  openSheet('<h2>اشتراک‌گذاری حواله</h2><p class="mu">منوی اشتراک‌گذاری سیستم در این مرورگر باز نشد. متن را کپی کنید و در هر برنامه‌ای که می‌خواهید بفرستید.</p><textarea class="taBox" id="shText" readonly style="direction:rtl;text-align:right">'+esc(t)+'</textarea><div class="btns"><button class="btn pri" data-act="copyShare">کپی متن حواله</button><button class="btn" data-act="closeSheet">بستن</button></div>');
}
A.copyShare=function(){
  var r=curRem().r;
  copyText($('#shText').value).then(function(ok){if(ok){closeSheet();bumpShare(r);toast('متن حواله کپی شد')}else toast('کپی نشد؛ متن را انتخاب و دستی کپی کنید')});
};
A.copyExp=function(){copyText($('#expText').value).then(function(ok){toast(ok?'متن کپی شد':'کپی نشد؛ متن را انتخاب و دستی کپی کنید');if(ok){db.lastBackup=nowISO();save()}})};

/* backup & csv */
A.backupSheet=function(){
  var lb=db.lastBackup?'آخرین پشتیبان: '+fmtStamp(db.lastBackup):'هنوز پشتیبان نگرفته‌اید.';
  openSheet('<h2>پشتیبان‌گیری و بازیابی</h2><p class="mu">'+lb+'</p><div class="btns"><button class="btn pri" data-act="dlBackup">دانلود پشتیبان (JSON)</button><button class="btn" data-act="pickRestore">بازیابی از فایل</button><button class="btn" data-act="pasteRestore">بازیابی از متن</button><button class="btn" data-act="closeSheet">بستن</button></div>');
};
A.dlBackup=function(){
  var json=backupJSON();
  saveFile('hawala-backup-'+stamp()+'.json',json,'application/json').then(function(s){
    if(s==='saved'){db.lastBackup=nowISO();save();closeSheet();render();toast('پشتیبان ذخیره شد')}
    else if(s==='fail')textExport('پشتیبان (JSON)',json);
  });
};
A.pickRestore=function(){closeSheet();$('#restoreFile').click()};
document.addEventListener('change',function(e){
  if(e.target.id==='restoreFile'){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){tryRestore(String(rd.result))};
    rd.onerror=function(){toast('خواندن فایل ممکن نشد')};
    rd.readAsText(f);e.target.value='';
  }
});
A.pasteRestore=function(){
  openSheet('<h2>بازیابی از متن</h2><p class="mu">متن پشتیبان را اینجا جایگذاری کنید.</p><textarea class="taBox" id="pasteBox" data-focus="1"></textarea><div class="btns"><button class="btn pri" data-act="doPaste">بازیابی</button><button class="btn" data-act="closeSheet">انصراف</button></div>');
};
A.doPaste=function(){var t=$('#pasteBox').value.trim();if(!t){toast('متنی جایگذاری نشده');return}tryRestore(t)};
A.csvAll=function(){closeSheet();exportCsv(db.companies,'all')};
A.csvOne=function(){var c=co(stack[stack.length-1].id);exportCsv([c],safeName(c.name))};

/* report */
A.report=function(){go('report',{cid:stack[stack.length-1].id})};
A.printRep=function(){try{window.print()}catch(e){toast('چاپ در این مرورگر ممکن نیست؛ «دانلود گزارش» را بزنید')}};
A.dlRep=function(){
  var c=co(stack[stack.length-1].cid);
  var html='<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش '+esc(c.name)+'</title><style>:root{--tx:#111;--mu:#555;--bd:#bbb;--s2:#f2f2f2}body{font-family:Vazirmatn,Tahoma,sans-serif;margin:24px;color:#111}'+REPORT_CSS+'</style></head><body>'+reportHTML(c)+'</body></html>';
  saveFile('hawala-report-'+safeName(c.name)+'-'+stamp()+'.html',html,'text/html').then(function(s){
    if(s==='saved')toast('گزارش ذخیره شد؛ آن را باز کنید و چاپ یا PDF بگیرید');else if(s==='fail')toast('ذخیرهٔ گزارش ممکن نشد');
  });
};

/* closing a month */
A.closeMonth=function(){
  var c=co(stack[stack.length-1].id),s=summary(c),j=jToday();
  var mo=MONTHS.map(function(m,i){return '<option value="'+(i+1)+'"'+(i+1===j[1]?' selected':'')+'>'+m+'</option>'}).join('');
  var yo='';for(var y=j[0]+1;y>=j[0]-3;y--)yo+='<option value="'+y+'"'+(y===j[0]?' selected':'')+'>'+D(y)+'</option>';
  openSheet('<h2>بستن حساب ماه</h2><p class="mu">وضعیت فعلی حساب ذخیره می‌شود. هیچ حواله‌ای حذف نمی‌شود و حساب ادامه پیدا می‌کند.</p>'+
    '<div class="field" id="fld_cm"><label>کدام ماه بسته شود؟</label><div class="three" style="grid-template-columns:1.6fr 1.2fr"><select id="cm_m" aria-label="ماه">'+mo+'</select><select id="cm_y" aria-label="سال">'+yo+'</select></div><div class="msg" id="msg_cm" hidden></div></div>'+
    '<div class="card" style="background:var(--s2)"><div class="lr" style="display:flex;justify-content:space-between"><span>جمع خوانده‌گی</span><b>'+money(s.r.total)+'</b></div><div style="display:flex;justify-content:space-between"><span>جمع پرداختی</span><b>'+money(s.p.total)+'</b></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span>وضعیت</span><span>'+pill(s.st)+' '+(s.diff?'<b>'+money(Math.abs(s.diff))+'</b>':'')+'</span></div></div>'+
    '<div class="btns"><button class="btn pri" data-act="doClose">بستن ماه</button><button class="btn" data-act="closeSheet">انصراف</button></div>');
};
A.doClose=function(){
  clearErrs();
  var c=co(stack[stack.length-1].id),s=summary(c);
  var m=Number($('#cm_m').value),y=Number($('#cm_y').value);
  if(c.closed.some(function(x){return x.jy===y&&x.jm===m})){showErr('cm','این ماه قبلاً بسته شده است. ماه دیگری را انتخاب کنید یا آن را از تاریخچه حذف کنید');return}
  var prev=c.closed.slice().sort(function(a,b){return a.closedAt<b.closedAt?1:-1})[0];
  var since=prev?prev.closedAt:'';
  var pr=c.read.filter(function(r){return r.createdAt>since}),pp=c.paid.filter(function(r){return r.createdAt>since});
  c.closed.unshift({
    id:uid(),jy:y,jm:m,label:MONTHS[m-1]+' '+y,closedAt:nowISO(),
    readCount:s.r.count,readTotal:s.r.total,paidCount:s.p.count,paidTotal:s.p.total,diff:s.diff,status:s.st,
    moveReadTotal:s.r.total-(prev?prev.readTotal:0),movePaidTotal:s.p.total-(prev?prev.paidTotal:0),
    readList:JSON.parse(JSON.stringify(pr)),paidList:JSON.parse(JSON.stringify(pp))
  });
  save();closeSheet();render();toast('ماه '+MONTHS[m-1]+' بسته شد');
};
A.delClosed=function(el){
  var cur=stack[stack.length-1],c=co(cur.cid),id=el.dataset.id;
  confirmSheet({title:'حذف از تاریخچه',msg:'فقط ثبت این ماه از تاریخچه پاک می‌شود. حواله‌های حساب دست نمی‌خورند.',ok:'حذف',danger:true},function(){
    c.closed=c.closed.filter(function(x){return x.id!==id});save();stack.pop();render();toast('از تاریخچه حذف شد');
  });
};

/* global click and keys */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(!f)return;
  if(el.classList.contains('mi'))closeSheet();
  f(el,e);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

if(!storageOk)setTimeout(function(){toast('ذخیره‌سازی مرورگر فعال نیست؛ پشتیبان بگیرید')},600);
render();
if(cloudEnabled())initCloud();
})();
</script>
