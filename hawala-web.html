<style>
#splash{position:fixed;inset:0;z-index:200;background:#0a0e16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .25s;color:#fff;font-family:Tahoma,'Segoe UI',system-ui,sans-serif}
#splash .lg{width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,#2a5fd6,#0d2452);display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(60,120,255,.55)}
#splash .nm{font-size:22px;font-weight:700}
#splash .ic,.lockpage .ic{width:132px;height:132px;border-radius:30px;display:block}
html.locked #app,html.locked #toast{display:none!important}
.lockpage{position:fixed;inset:0;z-index:95;background:#0a0e16;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Vazirmatn',Tahoma,sans-serif}
.lockpage .box{width:100%;max-width:340px}
.lockpage .lg{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#2a5fd6,#0d2452);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 30px rgba(60,120,255,.5)}
.lockpage h2{margin:0 0 6px;font-size:20px}
.lockpage p{margin:0 0 14px;color:#9fc1ff}
.lockpage input{width:100%;min-height:50px;border-radius:12px;border:1px solid #d6b46c;background:rgba(255,255,255,.07);color:#fff;padding:9px 12px}
.lockpage .btn{background:#d6b46c;color:#1a1304;border-color:transparent;width:100%;margin-top:12px}
.lockpage .msg{color:#ff9a9a;font-size:14px;margin-top:8px}
</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0a0e16;--s1:#111723;--s2:#171f2e;--bd:#232d40;--tx:#eef1f6;--mu:#8893a8;
  --ac:#d6b46c;--acx:#1a1304;--ok:#4fcba1;--bad:#ff8878;--zero:#9aa5ba;
  --okbg:rgba(79,203,161,.13);--badbg:rgba(255,136,120,.13);--zerobg:rgba(154,165,186,.13);
  color-scheme:dark;
}
html[data-theme=green]{--bg:#09130f;--s1:#0f1d17;--s2:#15271f;--bd:#213a2d;--tx:#e8f3ed;--mu:#86a595;--ac:#76d6a8;--acx:#05150d;--ok:#7be0ae;--bad:#ff907c;--zero:#9dbcae;--okbg:rgba(123,224,174,.14);--badbg:rgba(255,144,124,.14);--zerobg:rgba(157,188,174,.15);color-scheme:dark}
html[data-theme=gray]{--bg:#f3f1ec;--s1:#ffffff;--s2:#f7f5f1;--bd:#e5e1d8;--tx:#1b2030;--mu:#6c7282;--ac:#2a3450;--acx:#ffffff;--ok:#12865a;--bad:#c4372e;--zero:#5d6678;--okbg:rgba(18,134,90,.1);--badbg:rgba(196,55,46,.1);--zerobg:rgba(93,102,120,.1);color-scheme:light}
html[data-theme=ocean]{--bg:#07131e;--s1:#0d1e2d;--s2:#132a3d;--bd:#1e3a52;--tx:#e4f1fa;--mu:#85a8c0;--ac:#5cc0f0;--acx:#03121e;--ok:#4fe0b5;--bad:#ff8888;--zero:#8fb0c6;--okbg:rgba(79,224,181,.13);--badbg:rgba(255,136,136,.13);--zerobg:rgba(143,176,198,.15);color-scheme:dark}

html[data-theme=waves]{--bg:#060a22;--s1:rgba(14,22,62,.6);--s2:rgba(24,36,90,.6);--sheet:#0e1740;--bd:rgba(140,180,255,.2);--tx:#eaf0ff;--mu:#9aaad6;--ac:#7dd3fc;--acx:#03202e;--ok:#5eead4;--bad:#ff9aa8;--zero:#a8b6dc;--okbg:rgba(94,234,212,.14);--badbg:rgba(255,154,168,.14);--zerobg:rgba(168,182,220,.15);color-scheme:dark}
html[data-theme=mountains]{--bg:#0a1830;--s1:rgba(12,24,44,.66);--s2:rgba(26,42,68,.62);--sheet:#12233c;--bd:rgba(255,200,150,.2);--tx:#fdf3ea;--mu:#adb8ca;--ac:#ffb877;--acx:#2a1403;--ok:#7ee0b0;--bad:#ff8f86;--zero:#b3bdcc;--okbg:rgba(126,224,176,.14);--badbg:rgba(255,143,134,.14);--zerobg:rgba(179,189,204,.15);color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.75;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);padding:10px 0;margin:0 -14px 8px;padding-inline:10px;border-bottom:1px solid var(--bd)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.acts{display:flex;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--tx)}
.ib:hover{background:var(--s1)}

/* cards and buttons */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.badge-flag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12px;font-weight:600}
.pin-ic{color:var(--ac)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash div{text-align:center}
.dash small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
.dash b{font-size:18px}
.gsec{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
.trend{margin-top:12px}

<style>
/* company page */
.csum{text-align:center;padding:22px 18px 18px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 10%,var(--s1)),var(--s1) 70%);border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}
.csum .lbl{color:var(--mu);font-size:13px}
.csum .big{font-size:38px;font-weight:800;line-height:1.3;margin:4px 0 6px;letter-spacing:-.5px}
.csum .big.cred{color:var(--ok)}.csum .big.debt{color:var(--bad)}.csum .big.zero{color:var(--tx)}
.csum .why{font-size:13px;color:var(--mu);margin-top:10px}
.csum .split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:16px auto 0;max-width:260px;background:var(--bd)}
.csum .split i{display:block;height:100%}
.csum .split .a{background:var(--ok)}.csum .split .b{background:var(--bad)}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.kt{display:grid;gap:4px;text-align:start;padding:14px 14px 12px;border-radius:18px}
.kt .kh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.kt .kc{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.kt .kc svg{width:16px;height:16px}
.kt.read .kh{color:var(--ok)}.kt.read .kc{background:var(--okbg)}
.kt.paid .kh{color:var(--bad)}.kt.paid .kc{background:var(--badbg)}
.kt .kn{color:var(--mu);font-size:12.5px}
.kt .kv{font-size:19px;font-weight:700;margin-top:2px}
.csum + .duo2 + .card.trend,.card.trend{margin-top:0}
</style>
</head>

var W100=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];

function words(n){

    var pinc=cleanTx([e.d])[0];if(!pinc)return false;pinc.id=e.i;pinc.updatedAt=e.u;
    if(!px){pp.tx.push(pinc);ch=true}
    else if(e.u>tsOf(px)){pp.tx[pp.tx.indexOf(px)]=pinc;ch=true}
  }else{
    var cc=co(e.c);if(!cc)return false;
    var arr=cc[e.t];if(!Array.isArray(arr))return false;
    var loc=arr.find(function(x){return x.id===e.i});
    if(!loc){
      var inc=e.t==='closed'?cleanClosed([e.d])[0]:cleanList([e.d])[0];
      inc.id=e.i;inc.updatedAt=e.u;arr.push(inc);ch=true;
    }else if(e.u>tsOf(loc)){
      var inc2=e.t==='closed'?cleanClosed([e.d])[0]:cleanList([e.d])[0];
      inc2.id=e.i;inc2.updatedAt=e.u;
      arr[arr.indexOf(loc)]=inc2;ch=true;
    }
  }
  if(tb){clearCloudDeleted(e.t,e.c,e.i);ch=true}
  return ch;
}
function applyTomb(x){
  /* remote deletion: remove the local copy unless it was edited after the deletion */
  var k=entKey(x.t,x.c,x.i),have=tombOf(k),ch=false;
  if(!have||have.u<x.u){
    db.cloudDeleted=(db.cloudDeleted||[]).filter(function(z){return z.k!==k});
    db.cloudDeleted.push({k:k,t:x.t,c:x.c,i:x.i,u:x.u});
  }
  if(x.t==='company'){
    var c=co(x.i);if(c&&x.u>tsOf(c)){db.companies=db.companies.filter(function(z){return z.id!==x.i});ch=true}
  }else if(x.t==='pacc'){
    var pl=pa(x.i);if(pl&&x.u>tsOf(pl)){db.personal=db.personal.filter(function(z){return z.id!==x.i});ch=true}
  }else if(x.t==='ptx'){
    var pp=pa(x.c);
    if(pp){var px=pp.tx.find(function(z){return z.id===x.i});if(px&&x.u>tsOf(px)){pp.tx=pp.tx.filter(function(z){return z.id!==x.i});ch=true}}
  }else{
    var cc=co(x.c);
    if(cc&&Array.isArray(cc[x.t])){
      var loc=cc[x.t].find(function(z){return z.id===x.i});
      if(loc&&x.u>tsOf(loc)){cc[x.t]=cc[x.t].filter(function(z){return z.id!==x.i});ch=true}
    }
  }
  return ch;
}
function applyCloudData(data,pre){
  var recs=data.recs||{},dels=data.dels||{},changed=false,list=[];
  /* one-time import from the old single-blob format */
  if(data.payload&&!Object.keys(recs).length&&!Object.keys(dels).length){
    try{
      var old=sanitize(JSON.parse(data.payload)),oe=allEntities(old,false);
      Object.keys(oe).forEach(function(k){var e=oe[k];list.push({t:e.t,c:e.c,i:e.i,u:e.u,d:e.data})});
    }catch(e){}
  }
  Object.keys(dels).forEach(function(k){
    var x=parseRec(dels[k]);if(!x)return;
    pushedDel[k]=x.u;
    if(applyTomb(x))changed=true;
  });
  Object.keys(pre||recs).forEach(function(k){
    var e=pre?pre[k]:parseRec(recs[k]);if(!e||e.d===undefined)return;
    if(!(E.meta&&!e.enc))pushedTs[k]=e.u; /* plain record while encryption is on: re-encrypt it on the next push */
    list.push(e);
  });
  var rank={settings:0,company:1,pacc:1,read:2,paid:2,closed:2,ptx:2};
  list.sort(function(a,b){return (rank[a.t]||9)-(rank[b.t]||9)});
  list.forEach(function(e){if(applyEntity(e))changed=true});
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  return changed;
}
function onCloudSnap(snap){
  if(!snap.exists){cloudPush();return}
  var data=snap.data(),meta=parseMeta(data.enc);
  E.meta=meta;E.loaded=true;
  if(!meta){
    hideEncGate();E.pending=null;
    var ch=false;try{ch=applyCloudData(data,null)}catch(e){}
    if(ch)render();cloudPush();return;
  }
  if(!cryptoOK()){toast(L('این مرورگر از رمزگذاری پشتیبانی نمی‌کند'));return}
  ensureKey(meta).then(function(key){
    if(!key){E.pending=data;showEncGate();return}
    return decryptRecs(data.recs||{},key).then(function(map){
      hideEncGate();E.pending=null;
      var ch=false;try{ch=applyCloudData(data,map)}catch(e){}
      if(ch)render();cloudPush();
    });
  });
}

  if(!hits.length)return '';

function trendChart(c){
  var pts=c.closed.slice().sort(function(a,b){return a.closedAt<b.closedAt?-1:1});
  if(pts.length<2)return '<div class="card trend mu" style="font-size:13px">برای دیدن نمودار روند، حداقل ۲ ماه را ببندید.</div>';
  var w=320,h=90,pad=8,vals=pts.map(function(x){return x.diff});
  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));
  var rng=(mx-mn)||1;
  var step=(w-pad*2)/(pts.length-1);
  var zy=h-pad-((0-mn)/rng)*(h-pad*2);
  var path=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return (i?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  var dots=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="'+(x.diff>0?'var(--bad)':x.diff<0?'var(--ok)':'var(--zero)')+'"/>';
  }).join('');
  return '<div class="card trend"><div class="gsec" style="margin:0 0 8px">روند ماهانه (تفاوت حساب)</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible">'+
    '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="var(--bd)" stroke-width="1"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--ac)" stroke-width="2"/>'+dots+'</svg>'+
    '<div class="rem-bot"><span>'+esc(pts[0].label)+'</span><span>'+esc(pts[pts.length-1].label)+'</span></div></div>';
}

var dlCache;
function getDL(){
  if(dlCache!==undefined)return Promise.resolve(dlCache);
  if(!(window.claude&&window.claude.use)){dlCache=false;return Promise.resolve(false)}
  return window.claude.use('downloads').then(function(x){dlCache=x||null;return dlCache},function(){dlCache=null;return null});
}
function saveFile(name,data,mime){
  return getDL().then(function(dl){
    if(dl){
      return dl.save({filename:name,data:data}).then(function(){return 'saved'},function(e){
        if(e&&(e.code==='declined'))return 'declined';
        if(e&&e.code==='rate_limited'){toast('کمی صبر کنید و دوباره تلاش کنید');return 'declined'}
        return 'fail';
      });
    }
    if(dl===false){
      try{
        var u=URL.createObjectURL(new Blob([data],{type:mime}));
        var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},2000);return 'saved';
      }catch(e){return 'fail'}
    }
    return 'fail';
  });
}

var LOCK_KEY='hawala_lock_cfg';
function loadLockCfg(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')||{enabled:false,method:'',pinHash:'',credId:''}}catch(e){return {enabled:false,method:'',pinHash:'',credId:''}}}
function saveLockCfg(cfg){try{localStorage.setItem(LOCK_KEY,JSON.stringify(cfg))}catch(e){}}
function hashPin(pin){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode('hawala:'+pin)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  });
}
function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}
function webauthnAvailable(){
  return !!(window.PublicKeyCredential&&navigator.credentials)&&
    (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():Promise.resolve(false));
}
function webauthnSetup(){
  var challenge=crypto.getRandomValues(new Uint8Array(32)),userId=crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({publicKey:{
    challenge:challenge,rp:{name:'Hawala Ledger'},user:{id:userId,name:'hawala-user',displayName:'Hawala User'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000
  }}).then(function(cred){return b64u(cred.rawId)});
}
function webauthnVerify(credId){
  var challenge=crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.get({publicKey:{
    challenge:challenge,allowCredentials:[{id:b64uToBuf(credId),type:'public-key'}],userVerification:'required',timeout:60000
  }});
}

A.encSetupGo=function(){
  var m=$('#msg_encs'),p1=$('#enc_p1').value,p2=$('#enc_p2').value;m.hidden=true;
  function err(t){m.textContent=L(t);m.hidden=false}
  if(p1.length<8)return err('رمز باید حداقل ۸ نویسه باشد');
  if(p1!==p2)return err('تکرار رمز با رمز اول یکی نیست');
  if(!$('#enc_ok').checked)return err('اول تیک «رمز را جای امن نوشته‌ام» را بزنید');
  var salt=e64(crypto.getRandomValues(new Uint8Array(16))),iter=600000,key;
  m.textContent=L('در حال رمزگذاری؛ چند ثانیه صبر کنید...');m.hidden=false;
  deriveKey(p1,salt,iter).then(function(k){key=k;return encObj(key,'hawala-ok')}).then(function(chk){
    var meta={v:1,salt:salt,iter:iter,chk:chk};
    return buildRecs('enc',key).then(function(b){
      return docRef().set({enc:JSON.stringify(meta),recs:b.recs,payload:firebase.firestore.FieldValue.delete(),by:fb.user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(function(){
        b.rows.forEach(function(w){pushedTs[w[0]]=w[2]});
        E.key=key;E.saltId=salt;E.meta=meta;
        return keyPut({key:key,salt:salt});
      });
    });
  }).then(function(){closeSheet();render();toast(L('رمزگذاری فعال شد'))}).catch(function(){err('رمزگذاری ناموفق بود؛ اینترنت را بررسی و دوباره تلاش کنید')});
};

/* companies */
function coSheet(c){
  openSheet('<h2>'+L(c?'ویرایش و تنظیمات حساب':'افزودن حساب')+'</h2>'+
    field('c_name','نام شرکت یا صراف',c?c.name:'')+field('c_note','توضیحات (اختیاری)',c?c.note:'',{area:true})+
    '<div class="btns"><button class="btn pri" data-act="saveCo" '+(c?'data-id="'+c.id+'"':'')+'>'+L(c?'ذخیره':'افزودن حساب')+'</button><button class="btn" data-act="closeSheet">'+L('انصراف')+'</button></div>');
  var f=$('#c_name');if(f&&!c)setTimeout(function(){f.focus()},60);
}
A.addCo=function(){coSheet(null)};
A.editCo=function(){coSheet(co(stack[stack.length-1].id))};
function showErr(id,m){
  var f=$('#fld_'+id),g=$('#msg_'+id);
  if(f)f.classList.add('err');
  if(g){g.textContent=m;g.hidden=false}
}
function clearErrs(){
  document.querySelectorAll('.field.err').forEach(function(f){f.classList.remove('err')});
  document.querySelectorAll('.msg').forEach(function(g){g.hidden=true});
}
A.saveCo=function(el){
  clearErrs();
  var name=$('#c_name').value.trim(),note=$('#c_note').value.trim(),id=el.dataset.id;
  if(!name){showErr('c_name',L('نام حساب را وارد کنید'));return}
  var dup=db.companies.some(function(c){return c.id!==id&&norm(c.name)===norm(name)});
  if(dup){showErr('c_name',L('حسابی با این نام وجود دارد'));return}
  if(id){var c=co(id);c.name=name;c.note=note;c.updatedAt=nowISO();clearCloudDeleted('company','',id);save();closeSheet();render();toast(L('حساب ذخیره شد'))}
  else requireAuth(function(){
    var n={id:uid(),name:name,note:note,pinned:false,createdAt:nowISO(),updatedAt:nowISO(),read:[],paid:[],closed:[]};
    db.companies.push(n);save();closeSheet();ui.q='';ui.searchOpen=false;go('company',{id:n.id});toast(L('حساب اضافه شد'));
  });
};
A.delCo=function(){
  var c=co(stack[stack.length-1].id);
  confirmSheet({title:(db.lang==='en'?'Delete account "'+c.name+'"':'حذف حساب «'+c.name+'»'),msg:L('همهٔ حواله‌ها و تاریخچهٔ ماه‌های این حساب برای همیشه پاک می‌شود. اگر مطمئن نیستید، ابتدا پشتیبان بگیرید.'),ok:'حذف حساب',danger:true},function(){
    requireAuth(function(){
    markCloudDeleted('company','',c.id);['read','paid','closed'].forEach(function(k){c[k].forEach(function(z){markCloudDeleted(k,c.id,z.id)})});
    db.companies=db.companies.filter(function(x){return x.id!==c.id});save();stack=[{v:'home'}];render();toast(L('حساب حذف شد'));
    });
  });
};

/* amount input */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-amt]')){
    var v=toLatin(t.value).replace(/\D/g,'').replace(/^0+/,'').slice(0,12);
    t.value=D(v.replace(/\B(?=(\d{3})+(?!\d))/g,','));
    var w=$('#amtWords');if(w)w.textContent=v?words(Number(v))+' '+L('افغانی'):'—';
  }else if(t.id==='pq'){
    ui.pq=t.value;var pl=$('#plist');if(pl)pl.innerHTML=personalCards(ui.pq);
  }else if(t.id==='q'){
    ui.q=t.value;var l=$('#clist');if(l)l.innerHTML=companyCards(ui.q)+remGlobalResults(ui.q);
  }else if(t.id==='lq'){
    ui.listQ=t.value;var cur=stack[stack.length-1],full=co(cur.cid)[cur.kind];
    var filtered=ui.listQ?full.filter(function(r){return norm(r.sender+' '+r.receiver+' '+r.no+' '+r.place+' '+r.notes+' '+r.fatherName).indexOf(norm(ui.listQ))>-1}):full;
    var rl=$('#rlist');if(rl)rl.innerHTML=full.length?remRows(filtered):'<div class="empty"><b>حواله‌ای ثبت نشده</b>با «ثبت حواله» اولین مورد را اضافه کنید.</div>';
  }
});

/* remittances */
A.saveRem=function(){
  clearErrs();
  var cur=stack[stack.length-1],c=co(cur.cid),edit=!!cur.rid,list=c[cur.kind];
  var v={
    no:toLatin($('#f_no').value).trim(),idCard:toLatin($('#f_idc').value).trim(),
    sender:$('#f_sender').value.trim(),receiver:$('#f_receiver').value.trim(),fatherName:$('#f_father').value.trim(),
    amount:Number(toLatin($('#f_amt').value).replace(/\D/g,'').slice(0,12))||0,place:$('#f_place').value.trim(),notes:$('#f_notes').value.trim(),
    date:''
  };
  var bad=false;
  (function(){
    var y=Number($('#f_y').value),m=Number($('#f_m').value),d=Number($('#f_d').value),g;
    if(db.dateFmt==='greg'){
      var t=new Date(y,m-1,d);
      if(t.getMonth()===m-1&&t.getDate()===d)v.date=isoOf([y,m,d]);
    }else{
      g=j2g(y,m,d);var b=g2j(g[0],g[1],g[2]);
      if(b[0]===y&&b[1]===m&&b[2]===d)v.date=isoOf(g);
    }
    if(!v.date){showErr('date',L('این تاریخ وجود ندارد؛ روز یا ماه را درست کنید'));bad=true}
  })();
  if(cur.kind==='read'&&!edit)v.no=pad4(nextNo(c));
  if(!v.no){showErr('f_no',L('شمارهٔ حواله را وارد کنید'));bad=true}
  else if(list.some(function(r){return r.id!==cur.rid&&toLatin(r.no).trim()===v.no})){showErr('f_no',L('این شماره قبلاً در همین لیست ثبت شده است'));bad=true}
  if(!v.sender){showErr('f_sender',L('نام فرستنده را وارد کنید'));bad=true}
  if(!v.receiver){showErr('f_receiver',L('نام گیرنده را وارد کنید'));bad=true}
  if(!v.amount){showErr('f_amt',L('مبلغ را به عدد وارد کنید'));bad=true}
  if(!v.place){showErr('f_place',L('محل پرداخت را وارد کنید'));bad=true}
  if(bad){var e1=document.querySelector('.field.err');if(e1)e1.scrollIntoView({block:'center'});return}
  requireAuth(function(){
  if(stack[stack.length-1]!==cur)return;
  if(edit){
    var r=list.find(function(x){return x.id===cur.rid});
    Object.assign(r,v,{edited:true,editedAt:nowISO(),editedBy:currentUserLabel(),updatedAt:nowISO()});clearCloudDeleted(cur.kind,cur.cid,r.id);
  }else{
    list.unshift(Object.assign({id:uid(),createdAt:nowISO(),updatedAt:nowISO(),shares:0,edited:false,editedAt:'',createdBy:currentUserLabel(),editedBy:''},v));
  }
  save();stack.pop();render();window.scrollTo(0,0);toast(L(edit?'تغییرات ذخیره شد':'حواله ثبت شد'));
  });
};
A.delRem=function(){
  var cur=stack[stack.length-1],c=co(cur.cid);
  var r=c[cur.kind].find(function(x){return x.id===cur.rid});
  confirmSheet({title:L('حذف حواله')+' '+D(r.no),msg:L('این حواله حذف می‌شود و جمع‌ها دوباره محاسبه می‌شوند.'),ok:'حذف حواله',danger:true},function(){
    requireAuth(function(){
    markCloudDeleted(cur.kind,cur.cid,r.id);c[cur.kind]=c[cur.kind].filter(function(x){return x.id!==r.id});save();stack.pop();render();toast(L('حواله حذف شد'));
    });
  });
};

/* sharing */
function shareText(c,r){
  var line='_______________________________';
  var L=['🏛 '+c.name,'🗓 تاریخ: '+fmtDate(r.date),'','📑 مشخصات حواله',line,
    '#⃣ نمبر حواله: '+D(r.no),'#⃣ نمبر تذکره: '+(r.idCard?D(r.idCard):''),
    '👤 فرستنده: '+r.sender,'👤 گیرنده: '+r.receiver];
  L.push('👥 ولد گیرنده: '+(r.fatherName||''));
  L.push('💰 مبلغ: '+money(r.amount)+' افغانی','💰 مبلغ به حروف: '+words(r.amount)+' افغانی','📍 محل پرداخت: '+r.place,'توضیحات: '+(r.notes||''));
  return L.join('\n');
}
function curRem(){
  var cur=stack[stack.length-1],c=co(cur.cid);
  return {c:c,r:c[cur.kind].find(function(x){return x.id===cur.rid})};
}

var _h2cReady=null;
function loadHtml2Canvas(){
  if(window.html2canvas)return Promise.resolve(true);
  if(_h2cReady)return _h2cReady;
  _h2cReady=loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(function(){return true},function(){_h2cReady=null;return false});
  return _h2cReady;
}
function receiptBlob(c,r){
  return loadHtml2Canvas().then(function(ok){
    if(!ok||!window.html2canvas)return null;
    var host=document.createElement('div');
    host.style.cssText='position:fixed;left:-99999px;top:0;background:#050b1c;padding:1px';
    host.innerHTML=receiptCardHTML(c,r);
    document.body.appendChild(host);
    return window.html2canvas(host,{backgroundColor:'#050b1c',scale:2}).then(function(canvas){
      host.remove();
      return new Promise(function(res){canvas.toBlob(function(b){res(b)},'image/png')});
    },function(){host.remove();return null});
  });
}
function receiptFile(c,r){
  return receiptBlob(c,r).then(function(blob){
    if(!blob)return null;
    return new File([blob],'hawala-'+D(r.no)+'-'+stamp()+'.png',{type:'image/png'});
  });
}
A.share=function(){
  var x=curRem();
  if(navigator.share){
    navigator.share({text:shareText(x.c,x.r)}).then(function(){bumpShare(x.r)},function(e){
      if(!(e&&e.name==='AbortError'))receiptFallback(x,null);
    });
  }else receiptFallback(x,null);
};
function receiptFallback(x,file){

/* closing a month */
A.closeMonth=function(){
  var c=co(stack[stack.length-1].id),j=jToday();
  var mo=MONTHS.map(function(m,i){return '<option value="'+(i+1)+'"'+(i+1===j[1]?' selected':'')+'>'+m+'</option>'}).join('');
  var yo='';for(var y=j[0]+1;y>=j[0]-3;y--)yo+='<option value="'+y+'"'+(y===j[0]?' selected':'')+'>'+D(y)+'</option>';
  function monthSummary(){
    var m=Number($('#cm_m').value),y=Number($('#cm_y').value);
    function inMonth(r){var g=r.date.split('-').map(Number),jj=g2j(g[0],g[1],g[2]);return jj[0]===y&&jj[1]===m}
    var r=calc(c.read.filter(inMonth)),p=calc(c.paid.filter(inMonth)),diff=r.total-p.total;return {r:r,p:p,diff:diff,st:statusOf(diff)};
  }
  openSheet('<h2>'+L('بستن حساب ماه')+'</h2><p class="mu">'+L('وضعیت همین ماه ذخیره می‌شود. حواله‌ها حذف نمی‌شوند و حساب جاری ادامه پیدا می‌کند.')+'</p>'+
    '<div class="field" id="fld_cm"><label>'+L('کدام ماه بسته شود؟')+'</label><div class="three" style="grid-template-columns:1.6fr 1.2fr"><select id="cm_m" aria-label="'+(db.lang==='en'?'Month':'ماه')+'">'+mo+'</select><select id="cm_y" aria-label="'+(db.lang==='en'?'Year':'سال')+'">'+yo+'</select></div><div class="msg" id="msg_cm" hidden></div></div>'+
    '<div class="card" id="cm_preview" style="background:var(--s2)"></div>'+
    '<div class="field" style="margin-top:14px"><label for="cm_note">'+L('توضیحات (اختیاری) — مثلاً شمارهٔ حساب')+'</label><textarea id="cm_note" maxlength="2000"></textarea></div>'+
    '<div class="btns"><button class="btn pri" data-act="doClose">'+L('بستن ماه')+'</button><button class="btn" data-act="closeSheet">'+L('انصراف')+'</button></div>');
  function paint(){var s=monthSummary();var el=$('#cm_preview');if(!el)return;el.innerHTML='<div class="lr" style="display:flex;justify-content:space-between"><span>'+L('جمع خوانده‌گی')+'</span><b>'+money(s.r.total)+'</b></div><div style="display:flex;justify-content:space-between"><span>'+L('جمع پرداختی')+'</span><b>'+money(s.p.total)+'</b></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span>'+L('وضعیت')+'</span><span>'+pill(s.st)+' '+(s.diff?'<b>'+money(Math.abs(s.diff))+'</b>':'')+'</span></div>'}
  paint();
  ['cm_m','cm_y'].forEach(function(id){var el=$('#'+id);if(el)el.addEventListener('change',paint)});
};
A.doClose=function(){
  clearErrs();
  var c=co(stack[stack.length-1].id),m=Number($('#cm_m').value),y=Number($('#cm_y').value);
  if(c.closed.some(function(x){return x.jy===y&&x.jm===m})){showErr('cm',L('این ماه قبلاً بسته شده است. ماه دیگری را انتخاب کنید یا آن را از تاریخچه حذف کنید'));return}
  function inMonth(r){var g=r.date.split('-').map(Number),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===m}
  var pr=c.read.filter(inMonth),pp=c.paid.filter(inMonth);
  var rt=calc(pr),pt=calc(pp),diff=rt.total-pt.total,closedAt=nowISO();
  var it={id:uid(),jy:y,jm:m,label:MONTHS[m-1]+' '+y,closedAt:closedAt,updatedAt:closedAt,
    readCount:rt.count,readTotal:rt.total,paidCount:pt.count,paidTotal:pt.total,diff:diff,status:statusOf(diff),
    note:String(($('#cm_note')||{}).value||'').trim().slice(0,2000),moveReadTotal:rt.total,movePaidTotal:pt.total,readList:JSON.parse(JSON.stringify(pr)),paidList:JSON.parse(JSON.stringify(pp))};
  c.closed.unshift(it);clearCloudDeleted('closed',c.id,it.id);
  save();closeSheet();render();toast(L('ماه ')+MONTHS[m-1]+' '+D(y)+L(' بسته شد'));
};

  openSheet('<h2>'+L(x?'ویرایش تراکنش':(type==='sub'?'برداشت پول':'اضافه کردن پول'))+'</h2>'+

A.saveTx=function(el){
  clearErrs();
  var cur=stack[stack.length-1],a=pa(cur.pid),type=el.dataset.type==='sub'?'sub':'add';
  var amount=Number(toLatin($('#p_amt').value).replace(/\D/g,'').slice(0,12))||0,note=$('#p_note').value.trim(),date='';
  var y=Number($('#f_y').value),m=Number($('#f_m').value),d=Number($('#f_d').value);
  if(db.dateFmt==='greg'){var t=new Date(y,m-1,d);if(t.getMonth()===m-1&&t.getDate()===d)date=isoOf([y,m,d])}
  else{var g=j2g(y,m,d),b=g2j(g[0],g[1],g[2]);if(b[0]===y&&b[1]===m&&b[2]===d)date=isoOf(g)}
  var bad=false;
  if(!date){showErr('date',L('این تاریخ وجود ندارد؛ روز یا ماه را درست کنید'));bad=true}
  if(!amount){showErr('p_amt',L('مبلغ را به عدد وارد کنید'));bad=true}
  if(bad)return;
  if(el.dataset.id){
    var tx=a.tx.find(function(z){return z.id===el.dataset.id});
    if(tx){tx.amount=amount;tx.date=date;tx.note=note.slice(0,300);tx.updatedAt=nowISO();clearCloudDeleted('ptx',a.id,tx.id)}
    save();closeSheet();render();toast(L('تغییرات ذخیره شد'));return;
  }
  a.tx.unshift({id:uid(),type:type,amount:amount,date:date,note:note.slice(0,300),createdAt:nowISO(),updatedAt:nowISO(),createdBy:currentUserLabel()});
  save();closeSheet();render();toast(L('ثبت شد'));
};
