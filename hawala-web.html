<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر حواله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000000;--s1:#000000;--s2:#0a0a0a;--bd:#2f3336;--tx:#ffffff;--mu:#71767b;
  --ac:#6aa3ff;--acx:#00121f;--ok:#3ed598;--bad:#ff7a7a;--zero:#9aa7c0;
  --okbg:rgba(62,213,152,.14);--badbg:rgba(255,122,122,.14);--zerobg:rgba(154,167,192,.14);
  color-scheme:dark;
}
html[data-theme=green]{--bg:#0c1a14;--s1:#132a20;--s2:#1a3829;--bd:#2a4d3a;--tx:#e6f3ec;--mu:#8fb09f;--ac:#5fd39c;--acx:#06170f;--ok:#7be0ae;--bad:#ff8f7a;--zero:#9dbcae;--okbg:rgba(123,224,174,.15);--badbg:rgba(255,143,122,.15);--zerobg:rgba(157,188,174,.16);color-scheme:dark}
html[data-theme=gray]{--bg:#e9ebef;--s1:#ffffff;--s2:#f3f4f7;--bd:#d3d7df;--tx:#1c2230;--mu:#667085;--ac:#3f4a63;--acx:#ffffff;--ok:#0f8a57;--bad:#c02f2f;--zero:#5b6577;--okbg:rgba(15,138,87,.12);--badbg:rgba(192,47,47,.11);--zerobg:rgba(91,101,119,.12);color-scheme:light}
html[data-theme=ocean]{--bg:#06182a;--s1:#0c2a40;--s2:#123a56;--bd:#1f5073;--tx:#e2f1fa;--mu:#83a9c2;--ac:#3cc4f0;--acx:#031522;--ok:#4fe0b5;--bad:#ff8585;--zero:#8fb0c6;--okbg:rgba(79,224,181,.14);--badbg:rgba(255,133,133,.14);--zerobg:rgba(143,176,198,.16);color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.75;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);padding:10px 0;margin:0 -14px 8px;padding-inline:10px;border-bottom:1px solid var(--bd)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.acts{display:flex;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--tx)}
.ib:hover{background:var(--s1)}

/* cards and buttons */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.badge-flag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12px;font-weight:600}
.pin-ic{color:var(--ac)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash div{text-align:center}
.dash small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
.dash b{font-size:18px}
.gsec{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
.trend{margin-top:12px}
button.card{width:100%;text-align:start}
.rem{display:block}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);color:var(--acx);border-color:transparent}
.btn.dng{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btns{display:grid;gap:10px;margin-top:16px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row-btns .btn{padding:0 10px;font-size:14px;text-align:center}
.stack{display:grid;gap:10px}

/* pills */
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.8}
.pill.cred{color:var(--ok);background:var(--okbg)}
.pill.debt{color:var(--bad);background:var(--badbg)}
.pill.zero{color:var(--zero);background:var(--zerobg)}
.chip{display:inline-block;padding:0 9px;border-radius:8px;font-size:12px;background:var(--s2);color:var(--mu);border:1px solid var(--bd)}

/* home */
.co{display:flex;align-items:center;justify-content:space-between;gap:12px}
.co-name{font-weight:700;font-size:16px}
.co-sub{font-size:13px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap}
.co-end{text-align:end;display:grid;gap:2px;justify-items:end;flex-shrink:0}
.co-amt{font-weight:700;font-size:15px}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .btn{max-width:692px;margin:0 auto;display:flex}
.empty{text-align:center;padding:44px 18px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.note{border-inline-start:4px solid var(--ac);border-radius:8px;background:var(--s1);padding:10px 14px;margin-bottom:12px;font-size:14px}
.note.warn{border-color:var(--bad)}
.note .btn{min-height:38px;margin-top:8px;font-size:14px}
.search{margin-bottom:12px}

/* company page */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kind{display:grid;gap:2px}
.kind-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.kind.read .kind-h{color:var(--ok)}
.kind.paid .kind-h{color:var(--bad)}
.kind-n{color:var(--mu);font-size:13px}
.kind-t{font-size:18px;font-weight:700}
.ledger{margin-top:12px;padding:16px 18px}
.ledger .lr{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ledger .lr b{font-size:16px}
.ledger .rule{border-top:2px solid var(--tx);margin:8px 0 10px}
.ledger .net{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ledger .net b{font-size:24px;line-height:1.3}
.ledger .why{font-size:13px;color:var(--mu);margin-top:8px}

/* lists */
.sumbar{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:12px}
.sumbar small{display:block;color:var(--mu);font-size:13px}
.sumbar b{font-size:20px}
.rem{margin-top:10px}
.rem-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rno{font-weight:700;color:var(--mu)}
.ramt{font-weight:700;font-size:18px}
.rem-mid{font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* detail */
.det .big{font-size:28px;font-weight:700;line-height:1.3}
.det .words{color:var(--mu);font-size:14px;margin:2px 0 12px}
.dl{margin:0;display:grid;gap:0}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--bd)}
.dl dt{color:var(--mu);flex-shrink:0}
.dl dd{margin:0;text-align:end;overflow-wrap:anywhere}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);padding:9px 12px;font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.field input[dir=ltr]{text-align:right}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.msg{color:var(--bad);font-size:13px;margin-top:4px}
.three{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px}
.words-box{min-height:46px;border-radius:12px;border:1px dashed var(--bd);padding:9px 12px;color:var(--mu);font-size:14px;background:transparent}
.ro input{opacity:.8}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet h2{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 6px}
@keyframes up{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 6px;background:none;border:0;border-bottom:1px solid var(--bd);text-align:start;font-size:16px}
.mi:last-child{border-bottom:0}
.mi.dng{color:var(--bad)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.sw button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--bd);background:var(--s2)}
.sw button.on{border-color:var(--ac)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(128,128,128,.4);display:inline-block}
.taBox{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);padding:10px;font-size:14px;direction:ltr;text-align:left}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.sec{margin:18px 0 4px;font-size:15px;font-weight:700}

.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:88vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}

/* report */
.rep-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  html[data-theme]{--bg:#fff;--s1:#fff;--s2:#fff;--bd:#999;--tx:#111;--mu:#444;--ok:#0a7d4f;--bad:#b42323;--zero:#444;--okbg:#fff;--badbg:#fff;--zerobg:#fff}
  .no-print{display:none!important}
  :root{padding:0}
  .app{padding:0;max-width:none}
  body{background:#fff}
}
</style>
</head>

function fmtDate(iso){
  var g=String(iso).split('-').map(Number);
  if(db.dateFmt==='greg')return D(g[2])+' '+GMONTHS[g[1]-1]+' '+D(g[0]);
  var j=g2j(g[0],g[1],g[2]);
  return D(j[2])+' '+MONTHS[j[1]-1]+' '+D(j[0]);
}
function fmtStamp(iso){
  var d=new Date(iso);if(isNaN(d))return '';

}

function blank(){return {v:2,theme:'night',digits:'fa',dateFmt:'jalali',lang:'fa',lastBackup:'',debtThreshold:500000,inactiveDays:30,settingsUpdatedAt:'',cloudDeleted:[],companies:[]}}
function cleanList(a){
  return (Array.isArray(a)?a:[]).filter(function(r){return r&&typeof r==='object'}).map(function(r){
    var dt=/^\d{4}-\d{2}-\d{2}$/.test(r.date)?r.date:todayISO();
    var pa=dt.split('-').map(Number);
    if(pa[1]<1||pa[1]>12||pa[2]<1||pa[2]>31)dt=todayISO();
    else if(pa[0]<1700)dt=isoOf(j2g(pa[0],pa[1],pa[2]));
    return {
      id:String(r.id||uid()),createdAt:String(r.createdAt||nowISO()),updatedAt:String(r.updatedAt||r.editedAt||r.createdAt||nowISO()),date:dt,
      no:String(r.no==null?'':r.no).slice(0,20),idCard:String(r.idCard||'').slice(0,40),
      sender:String(r.sender||'').slice(0,100),receiver:String(r.receiver||'').slice(0,100),
      fatherName:String(r.fatherName||'').slice(0,100),
      amount:Math.max(0,Math.floor(Number(r.amount)||0)),
      place:String(r.place||'').slice(0,100),notes:String(r.notes||'').slice(0,500),
      shares:Math.max(0,Math.floor(Number(r.shares)||0)),edited:!!r.edited,editedAt:String(r.editedAt||''),
      createdBy:String(r.createdBy||'').slice(0,80),editedBy:String(r.editedBy||'').slice(0,80)
    };
  });
}
function cleanClosed(a){
  return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x==='object'}).map(function(x){

      readCount:n(x.readCount),readTotal:n(x.readTotal),paidCount:n(x.paidCount),paidTotal:n(x.paidTotal),
      diff:diff,status:statusOf(diff),

function sanitize(d){
  var out=blank();
  if(d&&THEMES[d.theme])out.theme=d.theme;
  if(d&&d.digits==='en')out.digits='en';
  if(d&&d.dateFmt==='greg')out.dateFmt='greg';
  if(d&&Number(d.debtThreshold)>0)out.debtThreshold=Math.floor(Number(d.debtThreshold));
  if(d&&Number(d.inactiveDays)>0)out.inactiveDays=Math.floor(Number(d.inactiveDays));
  if(d&&d.lang==='en')out.lang='en';
  if(d&&typeof d.lastBackup==='string')out.lastBackup=d.lastBackup;
  if(d&&typeof d.settingsUpdatedAt==='string')out.settingsUpdatedAt=d.settingsUpdatedAt;
  if(Array.isArray(d&&d.cloudDeleted))out.cloudDeleted=d.cloudDeleted.filter(function(x){return x&&x.k&&x.u}).map(function(x){return {k:String(x.k),t:String(x.t||''),c:String(x.c||''),i:String(x.i||''),u:String(x.u)}});
  (Array.isArray(d&&d.companies)?d.companies:[]).forEach(function(c){
    if(!c||typeof c.name!=='string')return;
    out.companies.push({
      id:String(c.id||uid()),name:c.name.trim().slice(0,80)||'بدون نام',note:String(c.note||'').slice(0,300),
      pinned:!!c.pinned,createdAt:String(c.createdAt||nowISO()),updatedAt:String(c.updatedAt||c.createdAt||nowISO()),read:cleanList(c.read),paid:cleanList(c.paid),closed:cleanClosed(c.closed)
    });
  });
  return out;
}

/* Per-record sync inside the SAME Firestore document (no rules change needed).
   Every record is its own field under "recs", so two people editing different
   records never overwrite each other. Conflict on the same record: newest updatedAt wins.
   Deletions are kept as tombstones under "dels" so deleted items don't come back. */
function tsOf(o){return String((o&&(o.updatedAt||o.editedAt||o.createdAt))||'')}
function entKey(t,c,i){return t+'|'+c+'|'+i}
function markCloudDeleted(t,c,i){
  var k=entKey(t,c||'',i);
  db.cloudDeleted=(db.cloudDeleted||[]).filter(function(x){return x.k!==k});
  db.cloudDeleted.push({k:k,t:t,c:c||'',i:i,u:nowISO()});
}
function clearCloudDeleted(t,c,i){var k=entKey(t,c||'',i);db.cloudDeleted=(db.cloudDeleted||[]).filter(function(x){return x.k!==k})}
function tombOf(k){return (db.cloudDeleted||[]).find(function(x){return x.k===k})||null}
function allEntities(d,withSettings){
  var m={};
  if(withSettings)m[entKey('settings','','s')]={t:'settings',c:'',i:'s',u:d.settingsUpdatedAt||'',data:{debtThreshold:d.debtThreshold,inactiveDays:d.inactiveDays}};
  d.companies.forEach(function(c){
    m[entKey('company','',c.id)]={t:'company',c:'',i:c.id,u:tsOf(c),data:{id:c.id,name:c.name,note:c.note,pinned:!!c.pinned,createdAt:c.createdAt}};
    ['read','paid'].forEach(function(k){c[k].forEach(function(r){m[entKey(k,c.id,r.id)]={t:k,c:c.id,i:r.id,u:tsOf(r),data:r}})});
    c.closed.forEach(function(x){m[entKey('closed',c.id,x.id)]={t:'closed',c:c.id,i:x.id,u:tsOf(x),data:x}});
  });
  return m;
}
var pushedTs={},pushedDel={},cloudPushT=null;
function cloudPush(){
  if(!fb.db||!fb.user)return;
  clearTimeout(cloudPushT);
  cloudPushT=setTimeout(function(){
    var ents=allEntities(db,true),recs={},dels={},sentR=[],sentD=[],n=0;
    Object.keys(ents).forEach(function(k){
      var e=ents[k];
      if(!e.u||pushedTs[k]===e.u)return;
      recs[k]=JSON.stringify({t:e.t,c:e.c,i:e.i,u:e.u,d:e.data});sentR.push([k,e.u]);n++;
    });
    (db.cloudDeleted||[]).forEach(function(x){
      if(pushedDel[x.k]===x.u)return;
      recs[x.k]=firebase.firestore.FieldValue.delete();
      dels[x.k]=JSON.stringify({t:x.t,c:x.c,i:x.i,u:x.u});sentD.push([x.k,x.u]);n++;
    });
    if(!n)return;
    docRef().set({recs:recs,dels:dels,by:fb.user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(function(){
      sentR.forEach(function(p){pushedTs[p[0]]=p[1]});sentD.forEach(function(p){pushedDel[p[0]]=p[1]});
    }).catch(function(){toast('همگام‌سازی ابری ناموفق بود؛ اینترنت را بررسی کنید')});
  },600);
}
function parseRec(v){try{var o=JSON.parse(v);return o&&o.t&&o.i!=null?o:null}catch(e){return null}}
function applyEntity(e){
  /* returns true if local data changed */
  var k=entKey(e.t,e.c,e.i),tb=tombOf(k);
  if(tb&&tb.u>=e.u)return false;
  if(e.t==='settings'){
    if(e.u>(db.settingsUpdatedAt||'')){
      var x=e.d||{};
      if(Number(x.debtThreshold)>0)db.debtThreshold=Math.floor(Number(x.debtThreshold));
      if(Number(x.inactiveDays)>0)db.inactiveDays=Math.floor(Number(x.inactiveDays));
      db.settingsUpdatedAt=e.u;return true;
    }
    return false;
  }
  var ch=false;
  if(e.t==='company'){
    var c=co(e.i),z=e.d||{};
    if(!c){db.companies.push({id:e.i,name:String(z.name||'بدون نام').slice(0,80),note:String(z.note||'').slice(0,300),pinned:!!z.pinned,createdAt:String(z.createdAt||nowISO()),updatedAt:e.u,read:[],paid:[],closed:[]});ch=true}
    else if(e.u>tsOf(c)){c.name=String(z.name||c.name).slice(0,80);c.note=String(z.note||'').slice(0,300);c.pinned=!!z.pinned;c.updatedAt=e.u;ch=true}
  }else{
    var cc=co(e.c);if(!cc)return false;
    var arr=cc[e.t];if(!Array.isArray(arr))return false;
    var loc=arr.find(function(x){return x.id===e.i});
    if(!loc){
      var inc=e.t==='closed'?cleanClosed([e.d])[0]:cleanList([e.d])[0];
      inc.id=e.i;inc.updatedAt=e.u;arr.push(inc);ch=true;
    }else if(e.u>tsOf(loc)){
      var inc2=e.t==='closed'?cleanClosed([e.d])[0]:cleanList([e.d])[0];
      inc2.id=e.i;inc2.updatedAt=e.u;
      arr[arr.indexOf(loc)]=inc2;ch=true;
    }
  }
  if(tb){clearCloudDeleted(e.t,e.c,e.i);ch=true}
  return ch;
}
function applyTomb(x){
  /* remote deletion: remove the local copy unless it was edited after the deletion */
  var k=entKey(x.t,x.c,x.i),have=tombOf(k),ch=false;
  if(!have||have.u<x.u){
    db.cloudDeleted=(db.cloudDeleted||[]).filter(function(z){return z.k!==k});
    db.cloudDeleted.push({k:k,t:x.t,c:x.c,i:x.i,u:x.u});
  }
  if(x.t==='company'){
    var c=co(x.i);if(c&&x.u>tsOf(c)){db.companies=db.companies.filter(function(z){return z.id!==x.i});ch=true}
  }else{
    var cc=co(x.c);
    if(cc&&Array.isArray(cc[x.t])){
      var loc=cc[x.t].find(function(z){return z.id===x.i});
      if(loc&&x.u>tsOf(loc)){cc[x.t]=cc[x.t].filter(function(z){return z.id!==x.i});ch=true}
    }
  }
  return ch;
}
function applyCloudData(data){
  var recs=data.recs||{},dels=data.dels||{},changed=false,list=[];
  /* one-time import from the old single-blob format */
  if(data.payload&&!Object.keys(recs).length&&!Object.keys(dels).length){
    try{
      var old=sanitize(JSON.parse(data.payload)),oe=allEntities(old,false);
      Object.keys(oe).forEach(function(k){var e=oe[k];list.push({t:e.t,c:e.c,i:e.i,u:e.u,d:e.data})});
    }catch(e){}
  }
  Object.keys(dels).forEach(function(k){
    var x=parseRec(dels[k]);if(!x)return;
    pushedDel[k]=x.u;
    if(applyTomb(x))changed=true;
  });
  Object.keys(recs).forEach(function(k){
    var e=parseRec(recs[k]);if(!e)return;
    pushedTs[k]=e.u;list.push(e);
  });
  var rank={settings:0,company:1,read:2,paid:2,closed:2};
  list.sort(function(a,b){return (rank[a.t]||9)-(rank[b.t]||9)});
  list.forEach(function(e){if(applyEntity(e))changed=true});
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  return changed;
}
function startCloudSync(){
  var gate=document.getElementById('loginGate');if(gate)gate.remove();
  if(fb.unsub)return;
  fb.unsub=docRef().onSnapshot(function(snap){
    if(!snap.exists){cloudPush();return}
    var changed=false;
    try{changed=applyCloudData(snap.data())}catch(e){}
    if(changed)render();
    cloudPush();
  },function(){toast('خطا در دریافت داده‌های ابری')});
}
function stopCloudSync(){if(fb.unsub){fb.unsub();fb.unsub=null}}
function showLoginGate(){
  var g=document.getElementById('loginGate');
  if(!g){g=document.createElement('div');g.id='loginGate';g.className='sheet-wrap';g.style.zIndex='90';document.body.appendChild(g)}

    '<div class="field"><label for="lg_email">ایمیل</label><input id="lg_email" type="email" dir="ltr" style="text-align:left" autocomplete="username"></div>'+
    '<div class="field"><label for="lg_pass">رمز عبور</label><input id="lg_pass" type="password" dir="ltr" style="text-align:left" autocomplete="current-password"></div>'+
    '<div class="msg" id="msg_login" hidden></div>'+
    '<div class="btns"><button class="btn pri" data-act="doLogin">ورود</button><button class="btn" data-act="cloudDisconnect">قطع اتصال ابری و کار آفلاین</button></div></div>';

function initCloud(){
  var cfg=loadFbConfig();if(!cfg)return;
  var v='8.10.1';
  loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-app.js')
    .then(function(){return loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-auth.js')})
    .then(function(){return loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore.js')})
    .then(function(){
      fb.app=(firebase.apps&&firebase.apps.length)?firebase.app():firebase.initializeApp(cfg);
      fb.auth=firebase.auth();fb.db=firebase.firestore();
      fb.auth.onAuthStateChanged(function(u){
        fb.user=u;
        if(u){startCloudSync()}else{stopCloudSync();showLoginGate()}
      });
    })
    .catch(function(){toast('اتصال ابری برقرار نشد؛ اینترنت یا تنظیمات را بررسی کنید')});
}
function calc(list){return {count:list.length,total:list.reduce(function(a,r){return a+r.amount},0)}}
function statusOf(diff){return diff>0?'debt':diff<0?'cred':'zero'}
function summary(c){
  var r=calc(c.read),p=calc(c.paid),diff=r.total-p.total;
  return {r:r,p:p,diff:diff,st:statusOf(diff)};
}
function lastActivity(c){
  var t='';
  c.read.concat(c.paid).forEach(function(r){if(r.createdAt>t)t=r.createdAt});
  return t;
}
function isFlagged(c){
  var s=summary(c);
  if(!s.diff)return false;
  if(Math.abs(s.diff)>=db.debtThreshold)return true;
  var la=lastActivity(c);
  if(!la)return false;
  var days=Math.floor((Date.now()-new Date(la).getTime())/864e5);
  return days>=db.inactiveDays;
}
function dashboardTotals(){
  var cred=0,debt=0;
  db.companies.forEach(function(c){var s=summary(c);if(s.st==='cred')cred+=Math.abs(s.diff);else if(s.st==='debt')debt+=Math.abs(s.diff)});
  return {cred:cred,debt:debt};
}
function nextNo(c){
  var m=0;
  c.read.forEach(function(r){var n=parseInt(toLatin(r.no),10);if(!isNaN(n)&&n>m)m=n});
  return m+1;
}
function byNew(a,b){return a.createdAt<b.createdAt?1:a.createdAt>b.createdAt?-1:0}

function copyText(t){
  return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){return true},function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta);ta.select();var ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    ta.remove();return ok;
  });
}

var V={};

function dashCard(){
  if(db.companies.length<2)return '';
  var t=dashboardTotals();
  return '<div class="card dash"><div><small>جمع طلبکاری</small><b style="color:var(--ok)">'+money(t.cred)+'</b></div><div><small>جمع بدهکاری</small><b style="color:var(--bad)">'+money(t.debt)+'</b></div></div>';
}
function remGlobalResults(q){
  if(!q)return '';
  var hits=[];
  db.companies.forEach(function(c){
    ['read','paid'].forEach(function(k){
      c[k].forEach(function(r){
        var hay=norm(r.sender+' '+r.receiver+' '+r.no+' '+r.place+' '+r.notes+' '+r.fatherName);
        if(hay.indexOf(norm(q))>-1)hits.push({c:c,k:k,r:r});
      });
    });
  });
  if(!hits.length)return '';
  hits.sort(function(a,b){return -byNew(a.r,b.r)});
  hits=hits.slice(0,20);
  return '<div class="gsec">نتایج حواله‌ها ('+D(hits.length)+')</div><div class="stack">'+hits.map(function(h){
    return '<button class="card rem" data-act="openRemFrom" data-cid="'+h.c.id+'" data-kind="'+h.k+'" data-id="'+h.r.id+'"><div class="rem-top"><span class="rno">'+esc(h.c.name)+' — '+L('شماره')+' '+D(h.r.no)+'</span><span class="ramt">'+money(h.r.amount)+'</span></div><div class="rem-mid">'+esc(h.r.receiver)+'</div><div class="rem-bot"><span>'+fmtDate(h.r.date)+'</span><span class="chip">'+KL(h.k)+'</span></div></button>';
  }).join('')+'</div>';
}
function trendChart(c){
  var pts=c.closed.slice().sort(function(a,b){return a.closedAt<b.closedAt?-1:1});
  if(pts.length<2)return '<div class="card trend mu" style="font-size:13px">برای دیدن نمودار روند، حداقل ۲ ماه را ببندید.</div>';
  var w=320,h=90,pad=8,vals=pts.map(function(x){return x.diff});
  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));
  var rng=(mx-mn)||1;
  var step=(w-pad*2)/(pts.length-1);
  var zy=h-pad-((0-mn)/rng)*(h-pad*2);
  var path=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return (i?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  var dots=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="'+(x.diff>0?'var(--bad)':x.diff<0?'var(--ok)':'var(--zero)')+'"/>';
  }).join('');
  return '<div class="card trend"><div class="gsec" style="margin:0 0 8px">روند ماهانه (تفاوت حساب)</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible">'+
    '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="var(--bd)" stroke-width="1"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--ac)" stroke-width="2"/>'+dots+'</svg>'+
    '<div class="rem-bot"><span>'+esc(pts[0].label)+'</span><span>'+esc(pts[pts.length-1].label)+'</span></div></div>';
}
function companyCards(q){
  var cs=db.companies.slice().sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return a.name.localeCompare(b.name,'fa');
  });
  if(q)cs=cs.filter(function(c){return norm(c.name).indexOf(norm(q))>-1});
  if(!db.companies.length)return '<div class="empty"><b>'+L('هنوز حسابی ثبت نشده')+'</b>'+L('با «افزودن حساب» اولین شرکت یا صراف را اضافه کنید.')+'</div>';
  if(!cs.length)return q?'':'<div class="empty"><b>'+L('حسابی پیدا نشد')+'</b>'+L('نام دیگری را جستجو کنید.')+'</div>';
  return (cs.length?'<div class="gsec">'+L('حساب‌ها')+'</div>':'')+'<div class="stack">'+cs.map(function(c){
    var s=summary(c),fl=isFlagged(c);
    return '<button class="card co" data-act="openCo" data-id="'+c.id+'"><div><div class="co-name">'+(c.pinned?'<span class="pin-ic">'+I.pin+'</span> ':'')+esc(c.name)+'</div><div class="co-sub"><span>'+D(s.r.count)+' '+L('حواله')+' '+KL('read')+'</span><span>'+D(s.p.count)+' '+L('حواله')+' '+KL('paid')+'</span></div>'+(fl?'<div class="badge-flag">'+I.flag+' '+L('نیاز به پیگیری')+'</div>':'')+'</div>'+
      '<div class="co-end">'+pill(s.st)+(s.diff?'<div class="co-amt">'+money(Math.abs(s.diff))+'</div>':'')+'</div></button>';
  }).join('')+'</div>';
}
function backupNote(){
  if(!db.companies.length)return '';
  var days=db.lastBackup?Math.floor((Date.now()-new Date(db.lastBackup).getTime())/864e5):null;
  if(days!==null&&days<7)return '';
  var txt=days===null?L('هنوز از اطلاعات پشتیبان نگرفته‌اید. داده‌ها فقط روی همین مرورگر ذخیره می‌شوند.'):(db.lang==='en'?('Last backup was '+D(days)+' days ago.'):('آخرین پشتیبان '+D(days)+' روز پیش بود.'));
  return '<div class="note no-print">'+txt+'<br><button class="btn" data-act="backupSheet">'+L('پشتیبان‌گیری')+'</button></div>';
}

var dlCache;
function getDL(){
  if(dlCache!==undefined)return Promise.resolve(dlCache);
  if(!(window.claude&&window.claude.use)){dlCache=false;return Promise.resolve(false)}
  return window.claude.use('downloads').then(function(x){dlCache=x||null;return dlCache},function(){dlCache=null;return null});
}
function saveFile(name,data,mime){
  return getDL().then(function(dl){
    if(dl){
      return dl.save({filename:name,data:data}).then(function(){return 'saved'},function(e){
        if(e&&(e.code==='declined'))return 'declined';
        if(e&&e.code==='rate_limited'){toast('کمی صبر کنید و دوباره تلاش کنید');return 'declined'}
        return 'fail';
      });
    }
    if(dl===false){
      try{
        var u=URL.createObjectURL(new Blob([data],{type:mime}));
        var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},2000);return 'saved';
      }catch(e){return 'fail'}
    }
    return 'fail';
  });
}

function stamp(){return todayISO()}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvFor(list){
  var head=['حساب','نوع','شماره حواله','تاریخ','فرستنده','گیرنده','ولد گیرنده','شماره تذکره','مبلغ (افغانی)','مبلغ به حروف','محل پرداخت','توضیحات','تعداد ارسال','ویرایش‌شده'];
  var rows=[head];
  list.forEach(function(c){
    ['read','paid'].forEach(function(k){
      c[k].slice().sort(function(a,b){return -byNew(a,b)}).forEach(function(r){
        rows.push([c.name,KIND[k],r.no,fmtDate(r.date).replace(/[۰-۹]/g,function(d){return FA_D.indexOf(d)}),r.sender,r.receiver,r.fatherName,r.idCard,r.amount,words(r.amount),r.place,r.notes,r.shares,r.edited?'بله':'']);
      });
    });
  });
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|\s]+/g,'-').slice(0,40)}

var A={};

/* ---------- app lock (PIN or device biometric, local to this device only) ---------- */
var LOCK_KEY='hawala_lock_cfg';
function loadLockCfg(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')||{enabled:false,method:'',pinHash:'',credId:''}}catch(e){return {enabled:false,method:'',pinHash:'',credId:''}}}
function saveLockCfg(cfg){try{localStorage.setItem(LOCK_KEY,JSON.stringify(cfg))}catch(e){}}
function hashPin(pin){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode('hawala:'+pin)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  });
}
function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}
function webauthnAvailable(){
  return !!(window.PublicKeyCredential&&navigator.credentials)&&
    (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():Promise.resolve(false));
}
function webauthnSetup(){
  var challenge=crypto.getRandomValues(new Uint8Array(32)),userId=crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({publicKey:{
    challenge:challenge,rp:{name:'Hawala Ledger'},user:{id:userId,name:'hawala-user',displayName:'Hawala User'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000
  }}).then(function(cred){return b64u(cred.rawId)});
}
function webauthnVerify(credId){
  var challenge=crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.get({publicKey:{
    challenge:challenge,allowCredentials:[{id:b64uToBuf(credId),type:'public-key'}],userVerification:'required',timeout:60000
  }});
}
function showLockGate(){
  var cfg=loadLockCfg();

  document.body.appendChild(g);

      (cfg.method==='webauthn'?'<div class="btns"><button class="btn pri wide" data-act="lockTryWebauthn">'+L('باز کردن با اثر انگشت')+'</button></div><div class="msg" id="msg_lockg" hidden></div>':
      '<div class="field"><label>'+L('رمز عبور را وارد کنید')+'</label><input id="lockPinInput" type="password" inputmode="numeric" dir="ltr" style="text-align:center;font-size:20px;letter-spacing:4px"></div><div class="msg" id="msg_lockg" hidden></div><div class="btns"><button class="btn pri wide" data-act="lockTryPin">'+L('باز کردن')+'</button></div>');
    var f=g.querySelector('#lockPinInput');if(f)setTimeout(function(){f.focus()},80);

A.lockTryWebauthn=function(){
  var cfg=loadLockCfg();
  webauthnVerify(cfg.credId).then(function(){
    var g=document.getElementById('lockGate');if(g)g.remove();
  },function(){
    var m=document.getElementById('msg_lockg');if(m){m.textContent=L('تأیید هویت ناموفق بود، دوباره تلاش کنید');m.hidden=false}
  });
};
A.lockTryPin=function(){
  var g=document.getElementById('lockGate'),input=g.querySelector('#lockPinInput'),m=g.querySelector('#msg_lockg');
  var cfg=loadLockCfg();
  hashPin(input.value||'').then(function(h){
    if(h===cfg.pinHash){g.remove()}
    else{m.textContent=L('رمز اشتباه است');m.hidden=false;input.value='';input.focus()}
  });
};

/* remittances */
A.saveRem=function(){
  clearErrs();
  var cur=stack[stack.length-1],c=co(cur.cid),edit=!!cur.rid,list=c[cur.kind];
  var v={
    no:toLatin($('#f_no').value).trim(),idCard:toLatin($('#f_idc').value).trim(),
    sender:$('#f_sender').value.trim(),receiver:$('#f_receiver').value.trim(),fatherName:$('#f_father').value.trim(),
    amount:Number(toLatin($('#f_amt').value).replace(/\D/g,''))||0,place:$('#f_place').value.trim(),notes:$('#f_notes').value.trim(),
    date:''
  };
  var bad=false;
  (function(){
    var y=Number($('#f_y').value),m=Number($('#f_m').value),d=Number($('#f_d').value),g;
    if(db.dateFmt==='greg'){
      var t=new Date(y,m-1,d);
      if(t.getMonth()===m-1&&t.getDate()===d)v.date=isoOf([y,m,d]);
    }else{
      g=j2g(y,m,d);var b=g2j(g[0],g[1],g[2]);
      if(b[0]===y&&b[1]===m&&b[2]===d)v.date=isoOf(g);
    }
    if(!v.date){showErr('date',L('این تاریخ وجود ندارد؛ روز یا ماه را درست کنید'));bad=true}
  })();
  if(cur.kind==='read'&&!edit)v.no=pad4(nextNo(c));
  if(!v.no){showErr('f_no',L('شمارهٔ حواله را وارد کنید'));bad=true}
  else if(list.some(function(r){return r.id!==cur.rid&&toLatin(r.no).trim()===v.no})){showErr('f_no',L('این شماره قبلاً در همین لیست ثبت شده است'));bad=true}
  if(!v.sender){showErr('f_sender',L('نام فرستنده را وارد کنید'));bad=true}
  if(!v.receiver){showErr('f_receiver',L('نام گیرنده را وارد کنید'));bad=true}
  if(!v.amount){showErr('f_amt',L('مبلغ را به عدد وارد کنید'));bad=true}
  if(!v.place){showErr('f_place',L('محل پرداخت را وارد کنید'));bad=true}
  if(bad){var e1=document.querySelector('.field.err');if(e1)e1.scrollIntoView({block:'center'});return}
  if(edit){
    var r=list.find(function(x){return x.id===cur.rid});
    Object.assign(r,v,{edited:true,editedAt:nowISO(),editedBy:currentUserLabel(),updatedAt:nowISO()});clearCloudDeleted(cur.kind,cur.cid,r.id);
  }else{
    list.unshift(Object.assign({id:uid(),createdAt:nowISO(),updatedAt:nowISO(),shares:0,edited:false,editedAt:'',createdBy:currentUserLabel(),editedBy:''},v));
  }
  save();stack.pop();render();window.scrollTo(0,0);toast(L(edit?'تغییرات ذخیره شد':'حواله ثبت شد'));
};

    '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span style="color:#9fc1ff;font-size:13px">'+esc(label)+'</span>'+

var _h2cReady=null;
function loadHtml2Canvas(){
  if(window.html2canvas)return Promise.resolve(true);
  if(_h2cReady)return _h2cReady;
  _h2cReady=loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(function(){return true},function(){_h2cReady=null;return false});
  return _h2cReady;
}
function receiptBlob(c,r){
  return loadHtml2Canvas().then(function(ok){
    if(!ok||!window.html2canvas)return null;
    var host=document.createElement('div');
    host.style.cssText='position:fixed;left:-99999px;top:0;background:#050b1c;padding:1px';
    host.innerHTML=receiptCardHTML(c,r);
    document.body.appendChild(host);
    return window.html2canvas(host,{backgroundColor:'#050b1c',scale:2}).then(function(canvas){
      host.remove();
      return new Promise(function(res){canvas.toBlob(function(b){res(b)},'image/png')});
    },function(){host.remove();return null});
  });
}
function receiptFile(c,r){
  return receiptBlob(c,r).then(function(blob){
    if(!blob)return null;
    return new File([blob],'hawala-'+D(r.no)+'-'+stamp()+'.png',{type:'image/png'});
  });
}
A.share=function(){
  var x=curRem();
  toast(L('در حال آماده‌سازی رسید...'));
  receiptFile(x.c,x.r).then(function(file){
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:x.c.name}).then(function(){bumpShare(x.r)},function(e){
        if(!(e&&e.name==='AbortError'))receiptFallback(x,file);
      });
    }else if(navigator.share){
      navigator.share({text:shareText(x.c,x.r)}).then(function(){bumpShare(x.r)},function(e){
        if(!(e&&e.name==='AbortError'))receiptFallback(x,file);
      });
    }else receiptFallback(x,file);
  });
};
function receiptFallback(x,file){
  var url=file?URL.createObjectURL(file):'';
  openSheet('<h2>'+L('اشتراک‌گذاری حواله')+'</h2>'+
    (url?'<img src="'+url+'" style="width:100%;border-radius:14px;margin-bottom:10px">':'<p class="mu">'+L('ساخت تصویر رسید ممکن نشد؛ به‌جایش متن حواله را کپی کنید.')+'</p>')+
    '<textarea class="taBox" id="shText" readonly style="direction:'+(db.lang==='en'?'ltr':'rtl')+';text-align:'+(db.lang==='en'?'left':'right')+'">'+esc(shareText(x.c,x.r))+'</textarea>'+
    '<div class="btns">'+(url?'<button class="btn pri" data-act="dlReceiptImg" data-url="'+url+'" data-name="'+esc(file.name)+'">'+L('دانلود تصویر رسید')+'</button>':'')+
    '<button class="btn" data-act="copyShare">'+L('کپی متن حواله')+'</button><button class="btn" data-act="closeSheet">'+L('بستن')+'</button></div>');
}
A.dlReceiptImg=function(el){
  var a=document.createElement('a');a.href=el.dataset.url;a.download=el.dataset.name;document.body.appendChild(a);a.click();a.remove();
  bumpShare(curRem().r);
};
A.printReceipt=function(){
  var x=curRem();
  toast(L('در حال آماده‌سازی رسید...'));
  receiptBlob(x.c,x.r).then(function(blob){
    var html='<!DOCTYPE html><html lang="'+(db.lang==='en'?'en':'fa')+'" dir="'+(db.lang==='en'?'ltr':'rtl')+'"><head><meta charset="utf-8"><title>'+esc(x.c.name)+' — '+D(x.r.no)+'</title>'+
      '<style>body{margin:0;padding:24px;background:#050b1c;display:flex;justify-content:center}img{max-width:420px;width:100%}@media print{body{padding:0}}</style></head><body>'+
      (blob?'<img src="'+URL.createObjectURL(blob)+'">':'<div style="color:#fff;font-family:sans-serif">'+esc(shareText(x.c,x.r)).replace(/\n/g,'<br>')+'</div>')+
      '</body></html>';
    saveFile('hawala-receipt-'+D(x.r.no)+'-'+stamp()+'.html',html,'text/html').then(function(s){
      if(s==='saved')toast(L('رسید ذخیره شد؛ آن را باز کنید و چاپ یا PDF بگیرید'));else if(s==='fail')toast(L('ذخیرهٔ رسید ممکن نشد'));
    });
  });
};
